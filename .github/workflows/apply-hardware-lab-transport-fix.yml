name: Apply Hardware Lab Transport Fix

on:
  push:
    branches: [develop]
    paths:
      - scripts/_hardware_lab_transport_fix.py
      - .github/workflows/apply-hardware-lab-transport-fix.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: develop
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Apply patch
        run: python scripts/_hardware_lab_transport_fix.py
      - name: Compile
        run: python -m py_compile custom_components/localtuya/pytuya/__init__.py tests/test_pytuya.py
      - name: Install test dependencies
        run: python -m pip install -r requirements_test.txt
      - name: Run focused transport regressions
        run: python -m unittest tests.test_pytuya -v
      - name: Remove temporary patcher
        run: rm scripts/_hardware_lab_transport_fix.py .github/workflows/apply-hardware-lab-transport-fix.yml
      - name: Commit final transport fix
        run: |
          git config user.name "Mattia Fontana"
          git config user.email "77722321+MattiaFontana997@users.noreply.github.com"
          git add custom_components/localtuya/pytuya/__init__.py tests/test_pytuya.py scripts/_hardware_lab_transport_fix.py .github/workflows/apply-hardware-lab-transport-fix.yml
          git commit -m "Fail fast on malformed Tuya frames and disconnects"
          git push origin HEAD:develop
