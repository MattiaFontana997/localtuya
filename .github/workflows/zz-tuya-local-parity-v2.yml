name: Apply tuya-local parity hardening v2

on:
  push:
    branches:
      - fix/6.7.0-tuya-local-parity

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/6.7.0-tuya-local-parity
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - name: Patch code and regressions
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def one(s, old, new, label):
              if old not in s:
                  raise SystemExit(f'missing anchor: {label}')
              return s.replace(old, new, 1)

          def between(s, start, end, new, label):
              i = s.find(start)
              j = s.find(end, i + 1) if i >= 0 else -1
              if i < 0 or j < 0:
                  raise SystemExit(f'missing range: {label}')
              return s[:i] + new + s[j:]

          # Discovery aliases seen across Tuya/TinyTuya ecosystems.
          p = Path('custom_components/localtuya/discovery.py')
          s = p.read_text()
          s = one(
              s,
              '        gw_id = device.get("gwId") or device.get("id")\n\n        if not gw_id:\n            _LOGGER.debug(\n                "Ignoring Tuya discovery packet "\n                "without device ID"\n            )\n            return\n',
              '        gw_id = (\n            device.get("gwId")\n            or device.get("id")\n            or device.get("devId")\n            or device.get("deviceId")\n            or device.get("dev_id")\n        )\n\n        if not gw_id:\n            _LOGGER.debug(\n                "Ignoring Tuya discovery packet from %s without device ID; fields=%s",\n                source_ip or "unknown",\n                sorted(str(key) for key in device),\n            )\n            return\n',
              'discovery id aliases',
          )
          p.write_text(s)

          p = Path('custom_components/localtuya/qr_onboarding.py')
          s = p.read_text()
          s = one(
              s,
              'CONF_QR_BULK_MODE = "qr_bulk_mode"\n',
              'CONF_QR_BULK_MODE = "qr_bulk_mode"\nCONF_QR_GATEWAY_ID = "qr_gateway_id"\n',
              'gateway selector constant',
          )

          marker = 'def _enrich_gateway_routes(\n'
          helpers = '''def _first_device_attr(device: Any, *names: str) -> Any:\n    """Return the first non-empty SDK attribute across known Tuya aliases."""\n    for name in names:\n        value = getattr(device, name, None)\n        if value is not None and str(value).strip():\n            return value\n    return ""\n\n\ndef _assign_gateway_route(\n    device: dict[str, Any],\n    gateway_id: str,\n    gateway: dict[str, Any],\n) -> bool:\n    """Attach one child to a selected/known gateway transport."""\n    gateway_id = str(gateway_id or "").strip()\n    if not gateway_id or not isinstance(gateway, dict):\n        return False\n    child_key = str(device.get(CONF_LOCAL_KEY) or "").strip()\n    gateway_key = str(gateway.get(CONF_LOCAL_KEY) or "").strip()\n    route_key = child_key or gateway_key\n    device["gateway_id"] = gateway_id\n    device["gateway_local_key"] = route_key\n    device["gateway_ip"] = str(gateway.get("ip") or "").strip()\n    device["gateway_name"] = gateway.get(CONF_NAME) or gateway_id\n    device.pop("gateway_candidates", None)\n    return bool(route_key)\n\n\n'''
          if helpers not in s:
              pos = s.find(marker)
              if pos < 0:
                  raise SystemExit('missing helper insertion point')
              s = s[:pos] + helpers + s[pos:]

          s = between(
              s,
              'def _enrich_gateway_routes(\n',
              'class _TokenCapture',
              '''def _enrich_gateway_routes(\n    devices: dict[str, dict[str, Any]],\n) -> dict[str, dict[str, Any]]:\n    """Resolve child routes conservatively while keeping children visible."""\n    hubs = {\n        str(device_id): device\n        for device_id, device in devices.items()\n        if isinstance(device, dict) and device.get("is_hub")\n    }\n    for device in devices.values():\n        if not isinstance(device, dict) or not device.get("node_id"):\n            continue\n        gateway_id = str(device.get("gateway_id") or "").strip()\n        gateway = devices.get(gateway_id) if gateway_id else None\n        if isinstance(gateway, dict):\n            _assign_gateway_route(device, gateway_id, gateway)\n        elif len(hubs) == 1:\n            inferred_id, inferred_gateway = next(iter(hubs.items()))\n            _assign_gateway_route(device, inferred_id, inferred_gateway)\n        elif hubs:\n            device["gateway_candidates"] = sorted(hubs)\n    return devices\n\n\n''',
              'route enrichment',
          )

          old = '''            local_key = str(getattr(device, "local_key", "") or "").strip()\n            product_id = str(getattr(device, "product_id", "") or "").strip()\n            category = str(getattr(device, "category", "") or "").strip()\n            node_id = str(getattr(device, "node_id", "") or "").strip()\n            gateway_id = str(\n                getattr(device, "gateway_id", "")\n                or getattr(device, "gatewayId", "")\n                or getattr(device, "parent_id", "")\n                or ""\n            ).strip()\n            is_subdevice = _is_subdevice_flag(getattr(device, "sub", False))\n            device_uuid = str(getattr(device, "uuid", "") or "").strip()\n            if not node_id and is_subdevice and device_uuid:\n                # Tuya frequently omits gateway_id while still providing the\n                # child's UUID.  For an explicit sub-device, UUID is the CID.\n                node_id = device_uuid\n            device_ip = str(getattr(device, "ip", "") or "").strip()\n'''
          new = '''            has_local_key_attr = hasattr(device, "local_key")\n            local_key = str(getattr(device, "local_key", "") or "").strip()\n            product_id = str(getattr(device, "product_id", "") or "").strip()\n            category = str(getattr(device, "category", "") or "").strip()\n            device_ip = str(getattr(device, "ip", "") or "").strip()\n            is_subdevice = _is_subdevice_flag(\n                _first_device_attr(device, "sub", "is_subdevice", "isSubDevice")\n            )\n            node_id = str(\n                _first_device_attr(\n                    device, "node_id", "nodeId", "cid", "device_cid", "deviceCid"\n                )\n                or ""\n            ).strip()\n            gateway_id = str(\n                _first_device_attr(\n                    device,\n                    "gateway_id", "gatewayId",\n                    "parent_id", "parentId",\n                    "parent_dev_id", "parentDevId",\n                    "parent_device_id", "parentDeviceId",\n                    "hub_id", "hubId",\n                )\n                or ""\n            ).strip()\n            device_uuid = str(getattr(device, "uuid", "") or "").strip()\n            if not node_id and device_uuid and (is_subdevice or not device_ip):\n                node_id = device_uuid\n\n            raw_fields = getattr(device, "__dict__", {})\n            if isinstance(raw_fields, dict):\n                _LOGGER.debug(\n                    "Tuya sharing metadata category=%s fields=%s",\n                    category or "unknown",\n                    sorted(str(key) for key in raw_fields),\n                )\n'''
          s = one(s, old, new, 'SDK metadata normalization')
          s = one(
              s,
              '                "is_hub": category in TUYA_HUB_CATEGORIES,\n',
              '                "is_hub": (\n                    category in TUYA_HUB_CATEGORIES\n                    or not has_local_key_attr\n                ),\n',
              'hub detection',
          )
          s = one(
              s,
              '        found_id = candidate.get("gwId") or candidate.get("id")\n',
              '        found_id = (\n            candidate.get("gwId")\n            or candidate.get("id")\n            or candidate.get("devId")\n            or candidate.get("deviceId")\n            or candidate.get("dev_id")\n        )\n',
              'QR discovery aliases',
          )

          s = between(
              s,
              'def _qr_is_locally_eligible(device: dict[str, Any]) -> bool:\n',
              'def _qr_needs_host_fallback',
              '''def _qr_is_locally_eligible(device: dict[str, Any]) -> bool:\n    """Keep routable children visible even when their hub is ambiguous."""\n    if not isinstance(device, dict):\n        return False\n    local_key = str(device.get(CONF_LOCAL_KEY) or "").strip()\n    gateway_key = str(device.get("gateway_local_key") or "").strip()\n    if str(device.get("node_id") or "").strip():\n        return bool(local_key or gateway_key)\n    return bool(local_key)\n\n\n''',
              'eligibility',
          )

          s = one(
              s,
              '''        if user_input is not None:\n            selected = user_input[CONF_DEVICE_ID]\n            cloud_device = eligible[selected]\n            self._qr_selected_device = copy.deepcopy(cloud_device)\n            try:\n''',
              '''        if user_input is not None:\n            selected = user_input[CONF_DEVICE_ID]\n            cloud_device = copy.deepcopy(eligible[selected])\n            if cloud_device.get("node_id") and not cloud_device.get("gateway_id"):\n                gateway_id = str(user_input.get(CONF_QR_GATEWAY_ID) or "").strip()\n                gateway = devices.get(gateway_id) if gateway_id else None\n                if not isinstance(gateway, dict) or not gateway.get("is_hub"):\n                    return self.async_show_form(\n                        step_id="qr_choose_device",\n                        data_schema=self._qr_device_schema(eligible, devices),\n                        errors={"base": "qr_subdevice_gateway_missing"},\n                        description_placeholders={\n                            "msg": "Select the hub/gateway used by this sub-device"\n                        },\n                    )\n                _assign_gateway_route(cloud_device, gateway_id, gateway)\n            self._qr_selected_device = copy.deepcopy(cloud_device)\n            try:\n''',
              'explicit gateway selection',
          )
          s = s.replace(
              'data_schema=self._qr_device_schema(eligible),',
              'data_schema=self._qr_device_schema(eligible, devices),',
          )

          s = one(
              s,
              '''    @staticmethod\n    def _qr_device_schema(devices: dict[str, dict[str, Any]]):\n        labels = {\n            device_id: (\n                f"{device.get(CONF_NAME) or device_id}"\n                f" ({device.get('product_name') or device.get('category') or 'Tuya'})"\n            )\n            for device_id, device in devices.items()\n        }\n        return vol.Schema(\n            {vol.Required(CONF_DEVICE_ID): vol.In(labels)}\n        )\n''',
              '''    @staticmethod\n    def _qr_device_schema(\n        devices: dict[str, dict[str, Any]],\n        all_devices: dict[str, dict[str, Any]] | None = None,\n    ):\n        labels = {\n            device_id: (\n                f"{device.get(CONF_NAME) or device_id}"\n                f" ({device.get('product_name') or device.get('category') or 'Tuya'})"\n            )\n            for device_id, device in devices.items()\n        }\n        schema: dict[Any, Any] = {\n            vol.Required(CONF_DEVICE_ID): vol.In(labels)\n        }\n        hubs = {\n            str(device_id): (\n                f"{device.get(CONF_NAME) or device_id}"\n                f" ({device.get('product_name') or device.get('category') or 'Gateway'})"\n            )\n            for device_id, device in (all_devices or devices).items()\n            if isinstance(device, dict) and device.get("is_hub")\n        }\n        if hubs:\n            schema[vol.Optional(CONF_QR_GATEWAY_ID, default="")] = vol.In(\n                {"": "Automatic / none", **hubs}\n            )\n        return vol.Schema(schema)\n''',
              'QR device/hub schema',
          )
          p.write_text(s)

          # Regressions.
          p = Path('tests/test_discovery.py')
          s = p.read_text()
          if 'test_device_registration_accepts_devid_aliases' not in s:
              pos = s.find('\n\nclass ActiveDiscoveryTests(')
              if pos < 0:
                  raise SystemExit('missing discovery test insertion point')
              test = '''\n    def test_device_registration_accepts_devid_aliases(self):\n        """Accept identity aliases emitted by some Tuya firmware families."""\n        discovery = TuyaDiscovery()\n        discovery.device_found(\n            {"devId": "alias-dev", "version": "3.5"},\n            source_ip="192.168.1.70",\n        )\n        discovery.device_found(\n            {"deviceId": "alias-device", "version": "3.4"},\n            source_ip="192.168.1.71",\n        )\n        self.assertEqual(discovery.devices["alias-dev"]["ip"], "192.168.1.70")\n        self.assertEqual(discovery.devices["alias-device"]["ip"], "192.168.1.71")\n\n'''
              s = s[:pos] + test + s[pos:]
          p.write_text(s)

          p = Path('tests/test_qr_onboarding.py')
          s = p.read_text()
          s = one(
              s,
              '    QrProvisioningError,\n    _base_entry_data,\n    async_prepare_qr_device,\n',
              '    QrProvisioningError,\n    _base_entry_data,\n    _enrich_gateway_routes,\n    _qr_is_locally_eligible,\n    async_prepare_qr_device,\n',
              'QR regression imports',
          )
          if 'class QrGatewayParityTests' not in s:
              pos = s.find('\n\nif __name__ == "__main__":')
              if pos < 0:
                  raise SystemExit('missing qr test insertion point')
              tests = '''\n\nclass QrGatewayParityTests(unittest.IsolatedAsyncioTestCase):\n    """Match proven tuya-local gateway-child onboarding semantics."""\n\n    def test_ambiguous_child_remains_selectable(self):\n        devices = {\n            "hub-1": {"id": "hub-1", "is_hub": True, CONF_LOCAL_KEY: "hub-key-1", "ip": "192.168.1.10"},\n            "hub-2": {"id": "hub-2", "is_hub": True, CONF_LOCAL_KEY: "hub-key-2", "ip": "192.168.1.11"},\n            "child": {\n                "id": "child", "name": "Bluetooth lamp",\n                "node_id": "child-cid", CONF_LOCAL_KEY: "child-key",\n                "gateway_id": "",\n            },\n        }\n        child = _enrich_gateway_routes(devices)["child"]\n        self.assertTrue(_qr_is_locally_eligible(child))\n        self.assertEqual(child["gateway_candidates"], ["hub-1", "hub-2"])\n        self.assertFalse(child.get("gateway_id"))\n\n    async def test_user_can_select_gateway_for_ambiguous_child(self):\n        flow = LocaltuyaConfigFlow()\n        flow.hass = SimpleNamespace(data={})\n        flow._qr_cloud = SimpleNamespace(auth={})\n        flow._qr_devices = {\n            "hub-1": {\n                "id": "hub-1", "name": "Hub 1", "product_name": "BLE Hub",\n                "is_hub": True, CONF_LOCAL_KEY: "hub-key", "ip": "192.168.1.10",\n            },\n            "hub-2": {\n                "id": "hub-2", "name": "Hub 2", "product_name": "BLE Hub",\n                "is_hub": True, CONF_LOCAL_KEY: "hub-key-2", "ip": "192.168.1.11",\n            },\n            "child": {\n                "id": "child", "name": "Lamp", "product_name": "BLE Lamp",\n                "node_id": "child-cid", CONF_LOCAL_KEY: "child-key",\n                "gateway_id": "", "is_hub": False,\n            },\n        }\n        with patch(\n            "custom_components.localtuya.qr_onboarding.async_prepare_qr_device",\n            new=AsyncMock(side_effect=QrProvisioningError("cannot_connect", "test")),\n        ) as prepare:\n            result = await flow.async_step_qr_choose_device(\n                {"device_id": "child", "qr_gateway_id": "hub-2"}\n            )\n        self.assertEqual(result["type"], FlowResultType.FORM)\n        self.assertEqual(result["step_id"], "qr_device_host")\n        routed = prepare.await_args.args[2]\n        self.assertEqual(routed["gateway_id"], "hub-2")\n        self.assertEqual(routed["gateway_local_key"], "child-key")\n        self.assertEqual(routed["gateway_ip"], "192.168.1.11")\n\n'''
              s = s[:pos] + tests + s[pos:]
          p.write_text(s)
          PY
          python -m compileall -q custom_components/localtuya tests
      - name: Commit patch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add custom_components/localtuya/discovery.py custom_components/localtuya/qr_onboarding.py tests/test_discovery.py tests/test_qr_onboarding.py
          git commit -m 'Harden Tuya gateway discovery and child onboarding'
          git push origin HEAD:fix/6.7.0-tuya-local-parity
