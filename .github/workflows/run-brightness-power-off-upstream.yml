name: Run upstream-exact brightness power fix

on:
  push:
    paths:
      - .github/workflows/run-brightness-power-off-upstream.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: develop
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Apply upstream-exact brightness semantics
        run: python .github/scripts/fix_brightness_power_off_upstream.py
      - name: Syntax check
        run: python -m py_compile custom_components/localtuya/light.py tests/test_light_residual_runtime.py
      - name: Install tox
        run: python -m pip install "tox>=4.20,<5"
      - name: Run full suite
        run: python -m tox -e py314
      - name: Commit exact runtime semantics
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add custom_components/localtuya/light.py tests/test_light_residual_runtime.py
          git diff --cached --check
          git commit -m "Match Tuya Local brightness-only scaling"
          git push origin HEAD:develop
