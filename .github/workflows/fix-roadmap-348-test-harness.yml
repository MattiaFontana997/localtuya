name: Fix roadmap 348 test harness

on:
  push:
    branches:
      - develop
    paths:
      - .github/workflows/fix-roadmap-348-test-harness.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
      - name: Apply test harness fixes
        run: python .github/scripts/fix_roadmap_348_test_harness.py
      - name: Compile tests
        run: |
          python -m compileall -q \
            tests/test_gateway_shared_transport.py \
            tests/test_health_runtime.py \
            tests/test_repairs.py \
            tests/test_mapping_diagnostics.py
      - name: Check whitespace
        run: git diff --check
      - name: Commit clean test fixes
        run: |
          git rm .github/workflows/fix-roadmap-348-test-harness.yml .github/scripts/fix_roadmap_348_test_harness.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix final roadmap test harness regressions"
          git push origin HEAD:develop
