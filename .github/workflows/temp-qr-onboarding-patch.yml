name: Temporary QR onboarding patch

on:
  push:
    branches:
      - feature/qr-onboarding
    paths:
      - .github/workflows/temp-qr-onboarding-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/qr-onboarding
      - name: Wire QR onboarding into config flow and translations
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          path = Path('custom_components/localtuya/config_flow.py')
          text = path.read_text()

          marker = '''from .mapping_export import (\n    build_mapping_contribution_package,\n)\n'''
          qr_import = '''from .mapping_export import (\n    build_mapping_contribution_package,\n)\nfrom .qr_onboarding import (\n    CONF_QR_AUTH,\n    QrConfigFlowMixin,\n    QrOptionsFlowMixin,\n)\n'''
          if 'from .qr_onboarding import (' not in text:
              if marker not in text:
                  raise SystemExit('mapping_export import marker not found')
              text = text.replace(marker, qr_import, 1)

          old_class = 'class LocaltuyaConfigFlow(config_entries.ConfigFlow, domain=DOMAIN):'
          new_class = 'class LocaltuyaConfigFlow(QrConfigFlowMixin, config_entries.ConfigFlow, domain=DOMAIN):'
          if old_class in text:
              text = text.replace(old_class, new_class, 1)

          old_options = 'class LocalTuyaOptionsFlowHandler(config_entries.OptionsFlow):'
          new_options = 'class LocalTuyaOptionsFlowHandler(QrOptionsFlowMixin, config_entries.OptionsFlow):'
          if old_options in text:
              text = text.replace(old_options, new_options, 1)

          start = text.index('    async def async_step_user(self, user_input=None):', text.index('class LocaltuyaConfigFlow'))
          end = text.index('    async def _create_entry(self, user_input):', start)
          user_method = '''    async def async_step_user(self, user_input=None):\n        """Choose the recommended QR onboarding or advanced manual setup."""\n        return self.async_show_menu(\n            step_id="user",\n            menu_options=[\n                "qr_login",\n                "manual_device",\n            ],\n        )\n\n'''
          text = text[:start] + user_method + text[end:]

          add_marker = '''    async def async_step_add_device(self, user_input=None):\n        """Handle adding a new device."""\n'''
          add_replacement = '''    async def async_step_add_device(self, user_input=None):\n        """Handle adding a new device."""\n        if (\n            self.config_entry.data.get(CONF_QR_AUTH)\n            and not getattr(self, "_manual_add_in_progress", False)\n        ):\n            return await self.async_step_add_device_method()\n'''
          if add_marker not in text:
              raise SystemExit('async_step_add_device marker not found')
          text = text.replace(add_marker, add_replacement, 1)
          path.write_text(text)

          qr_path = Path('custom_components/localtuya/qr_onboarding.py')
          qr = qr_path.read_text()
          qr = qr.replace('import voluptuous as vol\n', 'import voluptuous as vol\nimport homeassistant.helpers.config_validation as cv\n', 1)
          qr = qr.replace('self._force_manual_add = True\n        return await self.async_step_add_device()', 'self._manual_add_in_progress = True\n        return await self.async_step_add_device()', 1)
          qr = qr.replace('vol.Required("qr_mapping_selection", default=list(options)): vol.In(options)', 'vol.Required("qr_mapping_selection", default=list(options)): cv.multi_select(options)')
          qr_path.write_text(qr)

