name: LocalTuya Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apply-onboarding-fix:
    if: github.event_name == 'push' && github.ref == 'refs/heads/fix/6.6.0-gateway-lan-onboarding'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/6.6.0-gateway-lan-onboarding
      - name: Apply patch once
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('custom_components/localtuya/qr_onboarding.py')
          s = p.read_text()
          if 'def _is_gateway_device(' in s:
              raise SystemExit(0)

          old = '''            devices[device_id] = {
                "id": device_id,
                CONF_NAME: str(getattr(device, "name", "") or "").strip(),
                CONF_LOCAL_KEY: local_key,
                "product_id": product_id,
                "product_name": str(
                    getattr(device, "product_name", "") or ""
                ).strip(),
                "category": str(getattr(device, "category", "") or "").strip(),
                "online": bool(getattr(device, "online", False)),
                "support_local": bool(getattr(device, "support_local", False)),
                "node_id": node_id,
            }
'''
          new = '''            devices[device_id] = {
                "id": device_id,
                CONF_NAME: str(getattr(device, "name", "") or "").strip(),
                CONF_LOCAL_KEY: local_key,
                "product_id": product_id,
                "product_name": str(
                    getattr(device, "product_name", "") or ""
                ).strip(),
                "category": str(getattr(device, "category", "") or "").strip(),
                "online": bool(getattr(device, "online", False)),
                "support_local": bool(getattr(device, "support_local", False)),
                "node_id": node_id,
                "sub": bool(getattr(device, "sub", False)),
                "uuid": str(getattr(device, "uuid", "") or "").strip(),
                "model": str(getattr(device, "model", "") or "").strip(),
            }
'''
          assert old in s
          s = s.replace(old, new, 1)

          marker = 'def _qr_host_schema(default: str = "") -> vol.Schema:\n'
          helper = '''def _is_gateway_device(device: dict[str, Any]) -> bool:
    """Return whether sharing metadata describes a Tuya LAN gateway/hub."""
    category = str(device.get("category") or "").strip().lower()
    if category.startswith("wg"):
        return True
    text = " ".join(
        str(device.get(key) or "").lower()
        for key in (CONF_NAME, "product_name", "model")
    )
    return any(word in text for word in ("gateway", "wi-fi hub", "wifi hub"))


def _is_child_device(device: dict[str, Any]) -> bool:
    """Return whether a sharing record is a real gateway child device."""
    if _is_gateway_device(device):
        return False
    return bool(device.get("node_id")) and bool(device.get("sub", True))


def _discovery_by_host(
    devices: dict[str, dict[str, Any]], host: str
) -> dict[str, Any] | None:
    """Find cached discovery metadata by LAN address without guessing."""
    host = str(host or "").strip()
    matches = [
        copy.deepcopy(candidate)
        for candidate in devices.values()
        if isinstance(candidate, dict)
        and str(candidate.get("ip") or "").strip() == host
    ]
    return matches[0] if len(matches) == 1 else None


def _discovered_protocol_hint(discovered: dict[str, Any]) -> str:
    """Return a Tuya protocol hint from authenticated LAN discovery metadata."""
    version = str(discovered.get("version") or "").strip()
    return version if version in {"3.1", "3.2", "3.3", "3.4", "3.5"} else "auto"


'''
          assert marker in s
          s = s.replace(marker, helper + marker, 1)

          s = s.replace(
              '    if cloud_device.get("node_id"):\n',
              '    if _is_child_device(cloud_device):\n',
              1,
          )

          old = '''        discovered = {
            "gwId": device_id,
            "ip": host,
        }
'''
          new = '''        cached = hass.data.get(DOMAIN, {}).get(DATA_DISCOVERY)
        cached_devices = getattr(cached, "devices", {}) if cached is not None else {}
        by_host = (
            _discovery_by_host(cached_devices, host)
            if isinstance(cached_devices, dict)
            else None
        )
        discovered = by_host or {
            "gwId": device_id,
            "ip": host,
        }
'''
          assert old in s
          s = s.replace(old, new, 1)

          s = s.replace(
              '        CONF_PROTOCOL_VERSION: PROTOCOL_AUTO,\n',
              '        CONF_PROTOCOL_VERSION: _discovered_protocol_hint(discovered),\n',
              1,
          )

          old = '''            if device.get(CONF_LOCAL_KEY)
            and not device.get("node_id")
            and device.get("support_local", True)
'''
          new = '''            if device.get(CONF_LOCAL_KEY)
            and device.get("support_local", True)
            and not _is_child_device(device)
'''
          assert old in s
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY
          if git diff --quiet -- custom_components/localtuya/qr_onboarding.py; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add custom_components/localtuya/qr_onboarding.py
          git commit -m 'Fix gateway classification and reuse LAN protocol hints'
          git push origin HEAD:fix/6.6.0-gateway-lan-onboarding

  tests:
    name: Python 3.14 / HA 2026
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python 3.14
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements_test.txt

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install tox
        run: python -m pip install "tox>=4.20,<5"

      - name: Run tests
        run: python -m tox -e py314
