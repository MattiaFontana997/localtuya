name: LocalTuya Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Python 3.14 / HA 2026
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Bootstrap existing-entry QR account linking
        if: github.event_name == 'push' && github.ref == 'refs/heads/feature/qr-onboarding' && contains(github.event.head_commit.message, 'Bootstrap existing-entry QR account linking')
        shell: bash
        run: |
          python tools/qr_existing_account_link_patch.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git show HEAD^:.github/workflows/tox.yaml > .github/workflows/tox.yaml
          git rm tools/qr_existing_account_link_patch.py
          git add custom_components/localtuya/config_flow.py custom_components/localtuya/translations .github/workflows/tox.yaml
          git commit -m "Allow existing entries to link Tuya account by QR"
          git push origin HEAD:feature/qr-onboarding

      - name: Set up Python 3.14
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements_test.txt

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install tox
        run: python -m pip install "tox>=4.20,<5"

      - name: Run tests
        run: python -m tox -e py314
