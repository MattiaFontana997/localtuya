name: LocalTuya Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Python 3.14 / HA 2026
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements_test.txt

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install tox
        run: python -m pip install "tox>=4.20,<5"

      - name: Run tests
        run: python -m tox -e py314
