              '''                        cloud_device,\n                        host_override=host,\n                        diagnostics=getattr(\n                            self, \"_qr_provisioning_diagnostics\", None\n                        ),\n                    )''',
          )
          replace_once(
              "custom_components/localtuya/qr_onboarding.py",
              '''                except QrProvisioningError as exc:\n                    errors[\"base\"] = exc.reason\n                    placeholders = {\"msg\": exc.detail}''',
              '''                except QrProvisioningError as exc:\n                    self._qr_provisioning_diagnostics = copy.deepcopy(exc.diagnostics)\n                    errors[\"base\"] = exc.reason\n                    placeholders = {\n                        \"msg\": (\n                            f\"{exc.detail} | {_qr_trace_summary(exc.diagnostics)}\"\n                        )\n                    }''',
          )
          replace_once(
              "custom_components/localtuya/qr_onboarding.py",
              '''        if hubs:\n            schema[vol.Optional(CONF_QR_GATEWAY_ID, default=\"\")] = vol.In(\n                {\"\": \"Automatic / none\", **hubs}\n            )''',
              '''        if hubs:\n            schema[vol.Required(CONF_QR_GATEWAY_ID, default=\"\")] = vol.In(\n                {\"\": \"None / direct device\", **hubs}\n            )''',
          )

          # New focused regression tests. Keep them independent from translation UI.
          Path("tests/test_qr_explicit_gateway_diagnostics.py").write_text(r'''"""Regression tests for explicit gateway choice and provisioning traces."""

from __future__ import annotations

import unittest
from types import SimpleNamespace
from unittest.mock import AsyncMock, patch

from custom_components.localtuya.config_flow import CannotConnect
from custom_components.localtuya.const import CONF_LOCAL_KEY
from custom_components.localtuya.qr_onboarding import (
    QrProvisioningError,
    _apply_explicit_gateway_choice,
    _qr_requires_gateway,
    async_prepare_qr_device,
)


class ExplicitGatewayParityTests(unittest.TestCase):
    def setUp(self):
        self.hubs = {
            "hub-1": {
                "id": "hub-1",
                "name": "Hub 1",
                "is_hub": True,
                CONF_LOCAL_KEY: "hub-key-1",
                "ip": "198.51.100.10",
            },
            "hub-2": {
                "id": "hub-2",
                "name": "Hub 2",
                "is_hub": True,
                CONF_LOCAL_KEY: "hub-key-2",
                "ip": "198.51.100.11",
            },
        }

    def test_direct_cloud_record_rejects_gateway(self):
        device = {
            "id": "thermostat",
            "ip": "203.0.113.22",
            CONF_LOCAL_KEY: "child-key",
            "node_id": "",
            "sub": False,
        }
        self.assertFalse(_qr_requires_gateway(device))
        with self.assertRaises(QrProvisioningError) as ctx:
            _apply_explicit_gateway_choice(device, "hub-1", self.hubs)
        self.assertEqual(ctx.exception.reason, "qr_device_does_not_need_gateway")

    def test_indirect_cloud_record_requires_gateway(self):
        device = {
            "id": "lamp",
            "ip": "",
            "uuid": "lamp-cid",
            CONF_LOCAL_KEY: "child-key",
            "node_id": "",
            "sub": False,
        }
        self.assertTrue(_qr_requires_gateway(device))
        with self.assertRaises(QrProvisioningError) as ctx:
            _apply_explicit_gateway_choice(device, "", self.hubs)
        self.assertEqual(ctx.exception.reason, "qr_subdevice_gateway_missing")

    def test_explicit_gateway_overrides_inferred_parent_and_uses_child_key(self):
        device = {
            "id": "lamp",
            "ip": "",
            "uuid": "lamp-cid",
            "node_id": "lamp-cid",
            "gateway_id": "hub-1",
            "gateway_local_key": "old-key",
            CONF_LOCAL_KEY: "child-key",
            "sub": True,
        }
        _apply_explicit_gateway_choice(device, "hub-2", self.hubs)
        self.assertEqual(device["gateway_id"], "hub-2")
        self.assertEqual(device["node_id"], "lamp-cid")
        self.assertEqual(device["gateway_local_key"], "child-key")


class ProvisioningTraceTests(unittest.IsolatedAsyncioTestCase):
    async def test_failed_real_preflight_trace_is_attached_to_error(self):
        hass = SimpleNamespace(data={"localtuya": {"device_catalog": None}})
        cloud = SimpleNamespace(async_get_datamodel=AsyncMock(return_value=[]))
        device = {
            "id": "thermostat",
            "name": "Thermostat",
            "ip": "203.0.113.22",
            CONF_LOCAL_KEY: "local-key",
            "product_id": "thermostat-product",
            "node_id": "",
        }
        trace = {}

        async def fail_validation(hass, data, *, preflight_trace=None):
            preflight_trace.update(
                {
                    "3.5": {
                        "connect": "ConnectionRefusedError",
                        "connect_attempts": 2,
                    },
                    "3.4": {
                        "connect": "TimeoutError",
                        "connect_attempts": 2,
                    },
                    "_report": {
                        "ok": False,
                        "stage": "lan",
                        "failure": "host_unreachable",
                        "resolved_protocol": None,
                    },
                }
            )
            raise CannotConnect()

        with patch(
            "custom_components.localtuya.qr_onboarding._async_find_lan_device",
            new=AsyncMock(return_value={"gwId": "thermostat", "ip": "192.168.1.44"}),
        ), patch(
            "custom_components.localtuya.config_flow.validate_input",
            new=fail_validation,
        ):
            with self.assertRaises(QrProvisioningError) as ctx:
                await async_prepare_qr_device(
                    hass,
                    cloud,
                    device,
                    diagnostics=trace,
                )

        self.assertEqual(ctx.exception.reason, "cannot_connect")
        self.assertEqual(ctx.exception.diagnostics["discovery"], "found")
        self.assertEqual(ctx.exception.diagnostics["host"], "192.168.1.44")
        self.assertEqual(
            ctx.exception.diagnostics["preflight"]["failure"],
            "host_unreachable",
        )
        self.assertEqual(
            ctx.exception.diagnostics["protocol_steps"]["3.5"]["connect"],
            "ConnectionRefusedError",
        )
        cloud.async_get_datamodel.assert_not_awaited()


if __name__ == "__main__":
    unittest.main()
