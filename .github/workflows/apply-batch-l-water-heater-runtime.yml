name: Apply Batch L Water Heater Runtime

on:
  push:
    branches: [develop]
    paths: [".github/workflows/apply-batch-l-water-heater-runtime.yml"]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: develop
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Apply runtime patch
        run: python _apply_batch_l_water_heater_runtime.py
      - name: Compile runtime
        run: python -m py_compile custom_components/localtuya/water_heater.py tests/test_water_heater_advanced_mapping.py
      - name: Install test dependencies
        run: python -m pip install -r requirements_test.txt
      - name: Run focused water-heater tests
        run: |
          python -m unittest tests.test_catalog_platforms_batch_b -v
          python -m unittest tests.test_water_heater_advanced_mapping -v
      - name: Commit runtime and tests
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add custom_components/localtuya/water_heater.py tests/test_water_heater_advanced_mapping.py
          if git diff --cached --quiet; then
            echo "Batch L runtime already applied"
            exit 0
          fi
          git commit -m "Route water heater writes through advanced mappings"
          git push origin HEAD:develop
