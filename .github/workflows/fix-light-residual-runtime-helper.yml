name: Fix residual light runtime helper

on:
  push:
    paths:
      - .github/workflows/fix-light-residual-runtime-helper.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: develop
          fetch-depth: 0
      - name: Correct extended RGBHSV assertion
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('.github/workflows/patch-light-residual-runtime.yml')
          s = p.read_text()
          old = 'self.assertTrue(encoded.endswith("006464"))'
          new = 'self.assertTrue(encoded.endswith("00646464"))'
          if old not in s:
              raise SystemExit('assertion anchor missing')
          p.write_text(s.replace(old, new, 1))
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/workflows/patch-light-residual-runtime.yml
          git diff --cached --check
          git commit -m "Fix residual RGBHSV test expectation"
          git push origin HEAD:develop
