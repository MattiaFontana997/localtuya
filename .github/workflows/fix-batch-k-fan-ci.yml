name: Fix Batch K Fan CI

on:
  push:
    branches: [develop]
    paths: [".github/workflows/fix-batch-k-fan-ci.yml"]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: develop
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Apply compatibility fix
        run: python _fix_batch_k_fan_ci.py
      - name: Compile fan runtime
        run: python -m py_compile custom_components/localtuya/fan.py
      - name: Install test dependencies
        run: python -m pip install -r requirements_test.txt
      - name: Run fan regression tests
        run: python -m unittest tests.test_fan_tuya_local_semantics -v
      - name: Commit fix
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add custom_components/localtuya/fan.py
          if git diff --cached --quiet; then
            echo "Batch K fan CI fix already applied"
            exit 0
          fi
          git commit -m "Harden fan mapping fallbacks for regression harness"
          git push origin HEAD:develop
