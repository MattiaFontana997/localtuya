name: Run brightness off-value patch v4

on:
  push:
    paths:
      - .github/workflows/run-brightness-power-off-value-v4.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: develop
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Execute reviewed patch with exact catalog anchor
        run: |
          python - <<'PY'
          from pathlib import Path
          lines = Path('.github/workflows/run-brightness-power-off-value-v2.yml').read_text().splitlines()
          start = next(i for i, line in enumerate(lines) if line.strip() == "python - <<'PY'")
          end = next(i for i in range(start + 1, len(lines)) if lines[i].strip() == 'PY')
          body = '\n'.join(line[10:] if line.startswith('          ') else line for line in lines[start + 1:end])
          old = "anchor = '    CONF_EXTRA_STATE_ATTRIBUTES_DPS,\\n'\nassert text.count(anchor) == 1\ntext = text.replace(anchor, anchor + '    CONF_BRIGHTNESS_POWER_OFF_VALUE,\\n', 1)"
          new = "anchor = 'from .const import (\\n'\nassert text.count(anchor) == 1\ntext = text.replace(anchor, anchor + '    CONF_BRIGHTNESS_POWER_OFF_VALUE,\\n', 1)"
          assert body.count(old) == 1
          body = body.replace(old, new, 1)
          exec(compile(body, 'brightness-off-value-patch-v4', 'exec'))
          PY
      - name: Syntax check
        run: python -m py_compile custom_components/localtuya/const.py custom_components/localtuya/light.py custom_components/localtuya/device_catalog.py tests/test_light_residual_runtime.py tests/test_device_catalog.py
      - name: Install tox
        run: python -m pip install "tox>=4.20,<5"
      - name: Run full suite
        run: python -m tox -e py314
      - name: Commit runtime support
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add custom_components/localtuya/const.py custom_components/localtuya/light.py custom_components/localtuya/device_catalog.py tests/test_light_residual_runtime.py tests/test_device_catalog.py
          git diff --cached --check
          git commit -m "Support out-of-range brightness off values"
          git push origin HEAD:develop
