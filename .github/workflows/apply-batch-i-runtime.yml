name: Apply Batch I Runtime Flags

on:
  push:
    branches: [develop]
    paths: [".github/workflows/apply-batch-i-runtime.yml"]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: develop
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Apply runtime patch
        run: python _apply_batch_i_runtime.py
      - name: Compile modified modules
        run: python -m py_compile custom_components/localtuya/common.py custom_components/localtuya/device_catalog.py
      - name: Commit Batch I runtime
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add custom_components/localtuya/common.py custom_components/localtuya/device_catalog.py
          if git diff --cached --quiet; then
            echo "Runtime already patched"
            exit 0
          fi
          git commit -m "Add catalog hidden and non-persistent DP semantics"
          git push origin HEAD:develop
