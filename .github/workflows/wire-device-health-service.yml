name: Wire device health service

on:
  push:
    branches:
      - develop
    paths:
      - .github/workflows/wire-device-health-service.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: develop

      - name: Refactor diagnostics and register health service
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          diag_path = Path("custom_components/localtuya/diagnostics.py")
          text = diag_path.read_text(encoding="utf-8")
          text = text.replace("import asyncio\n", "", 1)
          text = text.replace(
              "from .config_flow import async_device_preflight\n",
              "from .health_runtime import async_build_device_health_snapshot\n",
              1,
          )
          text = text.replace("    TUYA_DEVICES,\n", "", 1)
          text = text.replace("DEVICE_HEALTH_PROBE_TIMEOUT = 10.0\n", "", 1)

          start = text.index("async def _async_device_health_diagnostics(")
          end = text.index("def _catalog_mapping_id(", start)
          text = text[:start] + text[end:]
          text = text.replace(
              "await _async_device_health_diagnostics(\n",
              "await async_build_device_health_snapshot(\n",
              1,
          )
          diag_path.write_text(text, encoding="utf-8")

          init_path = Path("custom_components/localtuya/__init__.py")
          text = init_path.read_text(encoding="utf-8")

          old = '''from .host_recovery import (\n    HostRecoveryOutcome,\n    async_recover_discovered_host,\n)\nfrom .mapping_export import build_mapping_submission\n'''
          new = '''from .host_recovery import (\n    HostRecoveryOutcome,\n    async_recover_discovered_host,\n)\nfrom .health_service import (\n    DeviceHealthTargetNotFound,\n    async_check_configured_device_health,\n)\nfrom .mapping_export import build_mapping_submission\n'''
          assert old in text, "health service import anchor not found"
          text = text.replace(old, new, 1)

          old = '''SERVICE_EXPORT_DEVICE_MAPPING_SCHEMA = vol.Schema(\n    {\n        vol.Required(\n            CONF_DEVICE_ID\n        ): cv.string,\n    }\n)\n\n\nasync def async_setup'''
          new = '''SERVICE_EXPORT_DEVICE_MAPPING_SCHEMA = vol.Schema(\n    {\n        vol.Required(\n            CONF_DEVICE_ID\n        ): cv.string,\n    }\n)\n\nSERVICE_CHECK_DEVICE_HEALTH = (\n    "check_device_health"\n)\nSERVICE_CHECK_DEVICE_HEALTH_SCHEMA = vol.Schema(\n    {\n        vol.Required(\n            CONF_DEVICE_ID\n        ): cv.string,\n    }\n)\n\n\nasync def async_setup'''
          assert old in text, "health service constants anchor not found"
          text = text.replace(old, new, 1)

          old = '''        except ValueError as ex:\n            raise HomeAssistantError(\n                str(ex)\n            ) from ex\n\n    async def _async_recover_discovered_device(\n'''
          new = '''        except ValueError as ex:\n            raise HomeAssistantError(\n                str(ex)\n            ) from ex\n\n    async def _handle_check_device_health(service):\n        """Return a bounded privacy-safe health report for one device."""\n        try:\n            return await async_check_configured_device_health(\n                hass,\n                service.data[CONF_DEVICE_ID],\n            )\n        except DeviceHealthTargetNotFound as ex:\n            raise HomeAssistantError(\n                "unknown LocalTuya device id"\n            ) from ex\n\n    async def _async_recover_discovered_device(\n'''
          assert old in text, "health service handler anchor not found"
          text = text.replace(old, new, 1)

          old = '''    hass.services.async_register(\n        DOMAIN, SERVICE_SET_DP, _handle_set_dp, schema=SERVICE_SET_DP_SCHEMA\n    )\n'''
          new = '''    async_register_admin_service(\n        hass,\n        DOMAIN,\n        SERVICE_CHECK_DEVICE_HEALTH,\n        _handle_check_device_health,\n        schema=(\n            SERVICE_CHECK_DEVICE_HEALTH_SCHEMA\n        ),\n        supports_response=(\n            SupportsResponse.ONLY\n        ),\n    )\n\n    hass.services.async_register(\n        DOMAIN, SERVICE_SET_DP, _handle_set_dp, schema=SERVICE_SET_DP_SCHEMA\n    )\n'''
          assert old in text, "health service registration anchor not found"
          text = text.replace(old, new, 1)

          init_path.write_text(text, encoding="utf-8")
          PY

      - name: Commit changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add custom_components/localtuya/__init__.py custom_components/localtuya/diagnostics.py
          git commit -m "Add privacy-safe device health check service"
          git push origin HEAD:develop
