name: Apply Batch M Dynamic Metadata

on:
  push:
    branches: [develop]
    paths: [".github/workflows/apply-batch-m-dynamic-metadata.yml"]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: develop
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: python _apply_batch_m_dynamic_metadata.py
      - run: python -m py_compile custom_components/localtuya/climate.py tests/test_climate_advanced_metadata.py
      - run: python -m pip install -r requirements_test.txt
      - name: Run focused and climate regression tests
        run: |
          python -m unittest tests.test_climate_advanced_metadata -v
          python -m unittest tests.test_catalog_platforms_batch_d -v
      - name: Commit runtime support
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add custom_components/localtuya/climate.py tests/test_climate_advanced_metadata.py
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Expose conditional climate mapping metadata"
          git push origin HEAD:develop
