name: Apply compatibility schema

on:
  push:
    branches: [develop]
    paths:
      - scripts/_compat_catalog_patch.py
      - .github/workflows/apply-compatibility-schema.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
      - run: python scripts/_compat_catalog_patch.py
      - run: python -m compileall -q custom_components/localtuya/device_catalog.py
      - run: |
          git rm scripts/_compat_catalog_patch.py .github/workflows/apply-compatibility-schema.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add custom_components/localtuya/device_catalog.py tests/test_catalog_compatibility_schema.py tests/test_compatibility_matrix.py tests/test_compatibility_matrix_catalog.py
          git commit -m "Add real-device compatibility metadata schema"
          git push origin HEAD:develop
