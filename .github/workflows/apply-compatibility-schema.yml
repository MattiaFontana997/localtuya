name: Complete 6.7 bulk compatibility zero-config

on:
  push:
    branches: [develop]
    paths:
      - scripts/_compat_catalog_patch.py
      - .github/workflows/apply-compatibility-schema.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: requirements_test.txt
      - name: Apply final 6.7 patch
        run: python scripts/_compat_catalog_patch.py
      - name: Install test dependencies
        run: python -m pip install -r requirements_test.txt
      - name: Regenerate compatibility matrix
        run: PYTHONPATH=. python scripts/generate_compatibility_matrix.py
      - name: Compile changed modules
        run: |
          python -m compileall -q \
            custom_components/localtuya/device_catalog.py \
            custom_components/localtuya/zero_config.py \
            custom_components/localtuya/qr_onboarding.py
      - name: Run completion regression tests
        run: |
          python -m unittest \
            tests.test_catalog_compatibility_schema \
            tests.test_compatibility_matrix \
            tests.test_compatibility_matrix_catalog \
            tests.test_bulk_onboarding \
            tests.test_bulk_zero_config_integration \
            tests.test_translation_coverage -v
      - name: Commit completed implementation and remove patch tooling
        run: |
          git rm scripts/_compat_catalog_patch.py .github/workflows/apply-compatibility-schema.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Complete 6.7 bulk compatibility and zero-config"
          git push origin HEAD:develop
