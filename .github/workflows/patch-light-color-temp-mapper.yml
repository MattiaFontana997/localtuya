name: Patch light color temperature mapper

on:
  push:
    branches:
      - compat/light-color-temp-raw-range
    paths:
      - .github/workflows/patch-light-color-temp-mapper.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: compat/light-color-temp-raw-range
          fetch-depth: 0

      - name: Apply mapper and endpoint fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              text = path.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one anchor, found {count}")
              path.write_text(text.replace(old, new, 1))

          mapper = Path("custom_components/localtuya/device_mapper.py")
          old_import = (
              "    CONF_COLOR,\n"
              "    CONF_COLOR_MODE,\n"
              "    CONF_COMMANDS_SET,\n"
          )
          new_import = (
              "    CONF_COLOR,\n"
              "    CONF_COLOR_MODE,\n"
              "    CONF_COLOR_TEMP_LOWER,\n"
              "    CONF_COLOR_TEMP_STEP,\n"
              "    CONF_COLOR_TEMP_UPPER,\n"
              "    CONF_COMMANDS_SET,\n"
          )
          replace_once(mapper, old_import, new_import)

          old_block = (
              "    if color_temp is not None:\n"
              "        temperature_range = _integer_range(color_temp)\n"
              "\n"
              "        # Current LocalTuya light code uses brightness_upper as the\n"
              "        # raw color-temperature maximum. Auto-map temperature only\n"
              "        # where the metadata confirms the ranges are compatible.\n"
              "        brightness_max = (\n"
              "            brightness_range[1]\n"
              "            if brightness_range is not None\n"
              "            else 1000\n"
              "        )\n"
              "\n"
              "        temperature_max = (\n"
              "            temperature_range[1]\n"
              "            if temperature_range is not None\n"
              "            else brightness_max\n"
              "        )\n"
              "\n"
              "        if temperature_max == brightness_max:\n"
              "            config[CONF_COLOR_TEMP] = color_temp.id\n"
              "            matched_codes.append(color_temp.code)\n"
          )
          new_block = (
              "    if color_temp is not None:\n"
              "        config[CONF_COLOR_TEMP] = color_temp.id\n"
              "        matched_codes.append(color_temp.code)\n"
              "\n"
              "        temperature_range = _integer_range(color_temp)\n"
              "        if temperature_range is not None:\n"
              "            config[CONF_COLOR_TEMP_LOWER] = temperature_range[0]\n"
              "            config[CONF_COLOR_TEMP_UPPER] = temperature_range[1]\n"
              "\n"
              "        temperature_step = _numeric_value(color_temp, \"step\")\n"
              "        if temperature_step is not None:\n"
              "            temperature_step = int(temperature_step)\n"
              "            if 1 <= temperature_step <= 10000:\n"
              "                config[CONF_COLOR_TEMP_STEP] = temperature_step\n"
          )
          replace_once(mapper, old_block, new_block)

          light = Path("custom_components/localtuya/light.py")
          old_endpoint = (
              "        raw_value = min(max(raw_value, raw_lower), raw_upper)\n"
              "\n"
              "        if self._color_temp_reverse:\n"
              "            raw_value = raw_lower + raw_upper - raw_value\n"
              "\n"
              "        ratio = (raw_value - raw_lower) / (raw_upper - raw_lower)\n"
          )
          new_endpoint = (
              "        raw_value = min(max(raw_value, raw_lower), raw_upper)\n"
              "\n"
              "        if self._color_temp_reverse:\n"
              "            raw_value = raw_lower + raw_upper - raw_value\n"
              "\n"
              "        if raw_value <= raw_lower:\n"
              "            return self._min_kelvin\n"
              "        if raw_value >= raw_upper:\n"
              "            return self._max_kelvin\n"
              "\n"
              "        ratio = (raw_value - raw_lower) / (raw_upper - raw_lower)\n"
          )
          replace_once(light, old_endpoint, new_endpoint)
          PY

      - name: Validate syntax and diff
        shell: bash
        run: |
          python -m compileall custom_components/localtuya/device_mapper.py custom_components/localtuya/light.py tests/test_light_color_temp_mapper_range.py
          git diff --check

      - name: Commit runtime and mapper support
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add custom_components/localtuya/device_mapper.py custom_components/localtuya/light.py
          git commit -m "Map independent light color temperature ranges"
          git push origin HEAD:compat/light-color-temp-raw-range
