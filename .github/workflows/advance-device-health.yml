name: Advance device health diagnostics

on:
  push:
    branches:
      - develop
    paths:
      - .github/workflows/advance-device-health.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: develop

      - name: Apply integration and diagnostics patches
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          init_path = Path("custom_components/localtuya/__init__.py")
          init_text = init_path.read_text(encoding="utf-8")
          old = '_LOGGER = logging.getLogger(__name__)\n\nLOADED_PLATFORMS = "loaded_platforms"'
          new = '_LOGGER = logging.getLogger(__name__)\n\nCONFIG_SCHEMA = cv.config_entry_only_config_schema(DOMAIN)\n\nLOADED_PLATFORMS = "loaded_platforms"'
          assert old in init_text, "__init__.py schema anchor not found"
          init_text = init_text.replace(old, new, 1)
          init_path.write_text(init_text, encoding="utf-8")

          path = Path("custom_components/localtuya/diagnostics.py")
          text = path.read_text(encoding="utf-8")

          old = 'from __future__ import annotations\n\nimport copy\nfrom typing import Any'
          new = 'from __future__ import annotations\n\nimport asyncio\nimport copy\nfrom typing import Any'
          assert old in text, "diagnostics asyncio import anchor not found"
          text = text.replace(old, new, 1)

          old = 'from .const import (\n    CONF_DPS_STRINGS,'
          new = 'from .config_flow import async_device_preflight\nfrom .const import (\n    CONF_DPS_STRINGS,'
          assert old in text, "diagnostics config_flow import anchor not found"
          text = text.replace(old, new, 1)

          old = '    DATA_DISCOVERY,\n    DOMAIN,\n)'
          new = '    DATA_DISCOVERY,\n    DOMAIN,\n    TUYA_DEVICES,\n)'
          assert old in text, "diagnostics TUYA_DEVICES import anchor not found"
          text = text.replace(old, new, 1)

          old = 'MAPPING_DIAGNOSTICS = "mapping"\n\n# QR account authorization'
          new = '''MAPPING_DIAGNOSTICS = "mapping"\nDEVICE_HEALTH_DIAGNOSTICS = "device_health"\nDEVICE_HEALTH_PROBE_TIMEOUT = 10.0\n\n# QR account authorization'''
          assert old in text, "diagnostics constants anchor not found"
          text = text.replace(old, new, 1)

          anchor = '''def _catalog_mapping_id(\n    matched_codes,\n) -> str | None:\n'''
          helper = '''async def _async_device_health_diagnostics(\n    hass: HomeAssistant,\n    device_id: str,\n    device_config: dict[str, Any],\n) -> dict[str, Any]:\n    """Return a bounded, privacy-safe live health snapshot."""\n    domain_data = hass.data.get(DOMAIN, {})\n    runtime_devices = domain_data.get(TUYA_DEVICES, {})\n    runtime_device = (\n        runtime_devices.get(device_id)\n        if isinstance(runtime_devices, dict)\n        else None\n    )\n\n    result: dict[str, Any] = {\n        "runtime_present": runtime_device is not None,\n        "runtime_connected": (\n            bool(getattr(runtime_device, "connected", False))\n            if runtime_device is not None\n            else None\n        ),\n        "preflight": None,\n    }\n\n    probe_data = copy.deepcopy(device_config)\n    probe_data[CONF_DEVICE_ID] = device_id\n\n    try:\n        async with asyncio.timeout(DEVICE_HEALTH_PROBE_TIMEOUT):\n            report = await async_device_preflight(\n                hass,\n                probe_data,\n            )\n    except TimeoutError:\n        result["probe_error_type"] = "TimeoutError"\n        return result\n    except Exception as ex:  # noqa: BLE001 - diagnostics must remain available.\n        # Keep only the exception class. Lower-level exception messages may\n        # contain network addresses, device identifiers, or credentials.\n        result["probe_error_type"] = type(ex).__name__\n        return result\n\n    result["preflight"] = report.as_dict()\n    return result\n\n\n'''
          assert anchor in text, "diagnostics helper insertion anchor not found"
          text = text.replace(anchor, helper + anchor, 1)

          old = '''    try:\n        data[\n            MAPPING_DIAGNOSTICS\n        ] = await (\n            _async_device_mapping_diagnostics(\n                hass,\n                dev_id,\n                device_config,\n            )\n        )\n\n    except Exception as ex:\n'''
          new = '''    data[\n        DEVICE_HEALTH_DIAGNOSTICS\n    ] = await _async_device_health_diagnostics(\n        hass,\n        dev_id,\n        device_config,\n    )\n\n    try:\n        data[\n            MAPPING_DIAGNOSTICS\n        ] = await (\n            _async_device_mapping_diagnostics(\n                hass,\n                dev_id,\n                device_config,\n            )\n        )\n\n    except Exception as ex:\n'''
          assert old in text, "diagnostics health call anchor not found"
          text = text.replace(old, new, 1)

          path.write_text(text, encoding="utf-8")
          PY

      - name: Commit changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add custom_components/localtuya/__init__.py custom_components/localtuya/diagnostics.py
          git commit -m "Expose privacy-safe live device health diagnostics"
          git push origin HEAD:develop
