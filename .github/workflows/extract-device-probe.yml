name: Extract device probe layer

on:
  push:
    branches:
      - develop
    paths:
      - .github/workflows/extract-device-probe.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: develop

      - name: Decouple config flow from protocol probe implementation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("custom_components/localtuya/config_flow.py")
          text = path.read_text(encoding="utf-8")

          text = text.replace("from .common import pytuya\n", "", 1)

          old = '''from .device_health import (\n    DeviceHealthFailure,\n    DeviceHealthReport,\n    DeviceHealthStage,\n    async_run_device_preflight,\n)\n'''
          new = '''from .device_health import DeviceHealthFailure\nfrom .device_probe import (\n    PROTOCOL_AUTO,\n    PROTOCOL_OPTIONS,\n    SUPPORTED_PROTOCOL_VERSIONS,\n    async_device_preflight,\n    reset_ids_from_data,\n)\n'''
          assert old in text, "device health import block not found"
          text = text.replace(old, new, 1)

          old = '''PROTOCOL_AUTO = "auto"\n\nSUPPORTED_PROTOCOL_VERSIONS = (\n    "3.5",\n    "3.4",\n    "3.3",\n    "3.2",\n    "3.1",\n)\n\nPROTOCOL_OPTIONS = (\n    PROTOCOL_AUTO,\n    *SUPPORTED_PROTOCOL_VERSIONS,\n)\n\nPROTOCOL_PROBE_TIMEOUT = 8.0\n\n\n'''
          assert old in text, "protocol constants block not found"
          text = text.replace(old, "", 1)

          start = text.index("async def _async_probe_protocol(")
          end = text.index("async def validate_input(", start)
          text = text[:start] + text[end:]

          text = text.replace(
              "reset_ids = _reset_ids_from_data(data)",
              "reset_ids = reset_ids_from_data(data)",
          )

          assert "_async_probe_protocol" not in text
          assert "_reset_ids_from_data" not in text
          assert "pytuya" not in text
          path.write_text(text, encoding="utf-8")

          test_path = Path("tests/test_config_flow_device_health.py")
          tests = test_path.read_text(encoding="utf-8")
          tests = tests.replace(
              "from custom_components.localtuya import config_flow\n",
              "from custom_components.localtuya import config_flow, device_probe\n",
              1,
          )
          tests = tests.replace(
              '            config_flow,\n            "_async_probe_protocol",',
              '            device_probe,\n            "_async_probe_protocol",',
          )
          assert 'config_flow,\n            "_async_probe_protocol"' not in tests
          test_path.write_text(tests, encoding="utf-8")
          PY

      - name: Commit refactor
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add custom_components/localtuya/config_flow.py tests/test_config_flow_device_health.py
          git commit -m "Decouple device probing from config flow"
          git push origin HEAD:develop
