name: Update repair translations

on:
  push:
    branches:
      - develop
    paths:
      - .github/workflows/update-repair-translations.yml

permissions:
  contents: write

jobs:
  update-translations:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: develop

      - name: Update LocalTuya repair translations
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          issue_blocks = {
              "en": {
                  "title": "LocalTuya could not safely recover {device_name}",
                  "description": "LocalTuya discovered a possible LAN address change for {device_name}, but the new address could not be validated with the saved local credentials. The configured address was not changed.",
                  "fix_flow": {
                      "error": {
                          "cannot_connect": "The device did not respond at that address. Check that it is powered on and reachable from Home Assistant.",
                          "invalid_auth": "The device answered, but its saved local credentials were rejected. Re-link or reconfigure the device credentials before retrying.",
                          "empty_dps": "The device connection succeeded, but no datapoints were returned. Retry after the device is fully online.",
                          "invalid_host": "Enter a valid LAN IP address or hostname.",
                          "unknown": "The address could not be validated safely. The existing configuration was left unchanged.",
                          "stale": "The device address changed again while validation was running. Retry discovery or enter the current address manually.",
                          "device_not_found": "The configured device was not found during LAN discovery. You can enter its current address manually.",
                          "discovery_unavailable": "Automatic LAN discovery is not available right now. Enter the device address manually.",
                          "discovery_failed": "Automatic LAN discovery failed. Enter the device address manually or retry later."
                      },
                      "step": {
                          "init": {
                              "title": "Repair LAN connection for {device_name}",
                              "description": "Choose automatic rediscovery or enter the device's current LAN address. LocalTuya validates Device ID, local key, protocol and datapoints before saving any new address.",
                              "menu_options": {
                                  "rediscover": "Retry automatic LAN discovery",
                                  "manual_host": "Enter IP address / hostname manually"
                              }
                          },
                          "manual_host": {
                              "title": "Enter the current LAN address",
                              "description": "Enter the current IP address or hostname for {device_name}. The address will be saved only after a successful authenticated LocalTuya validation.",
                              "data": {
                                  "host": "IP address / Host"
                              }
                          }
                      }
                  }
              },
              "it": {
                  "title": "LocalTuya non è riuscito a ripristinare in sicurezza {device_name}",
                  "description": "LocalTuya ha rilevato un possibile cambio di indirizzo LAN per {device_name}, ma il nuovo indirizzo non è stato convalidato con le credenziali locali salvate. L'indirizzo configurato non è stato modificato.",
                  "fix_flow": {
                      "error": {
                          "cannot_connect": "Il dispositivo non risponde a questo indirizzo. Verifica che sia acceso e raggiungibile da Home Assistant.",
                          "invalid_auth": "Il dispositivo risponde, ma le credenziali locali salvate sono state rifiutate. Ricollega o riconfigura le credenziali del dispositivo prima di riprovare.",
                          "empty_dps": "La connessione al dispositivo è riuscita, ma non sono stati restituiti datapoint. Riprova quando il dispositivo è completamente online.",
                          "invalid_host": "Inserisci un indirizzo IP LAN o un nome host valido.",
                          "unknown": "Non è stato possibile convalidare l'indirizzo in sicurezza. La configurazione esistente è rimasta invariata.",
                          "stale": "L'indirizzo del dispositivo è cambiato di nuovo durante la convalida. Ripeti la ricerca o inserisci manualmente l'indirizzo attuale.",
                          "device_not_found": "Il dispositivo configurato non è stato trovato durante la ricerca LAN. Puoi inserire manualmente il suo indirizzo attuale.",
                          "discovery_unavailable": "La ricerca LAN automatica non è disponibile in questo momento. Inserisci manualmente l'indirizzo del dispositivo.",
                          "discovery_failed": "La ricerca LAN automatica non è riuscita. Inserisci manualmente l'indirizzo del dispositivo oppure riprova più tardi."
                      },
                      "step": {
                          "init": {
                              "title": "Ripara la connessione LAN di {device_name}",
                              "description": "Scegli la ricerca automatica oppure inserisci l'indirizzo LAN attuale del dispositivo. LocalTuya convalida Device ID, local key, protocollo e datapoint prima di salvare un nuovo indirizzo.",
                              "menu_options": {
                                  "rediscover": "Ripeti la ricerca LAN automatica",
                                  "manual_host": "Inserisci manualmente IP / nome host"
                              }
                          },
                          "manual_host": {
                              "title": "Inserisci l'indirizzo LAN attuale",
                              "description": "Inserisci l'indirizzo IP o il nome host attuale di {device_name}. L'indirizzo verrà salvato solo dopo una convalida LocalTuya autenticata riuscita.",
                              "data": {
                                  "host": "Indirizzo IP / Host"
                              }
                          }
                      }
                  }
              },
              "de": {
                  "title": "LocalTuya konnte {device_name} nicht sicher wiederherstellen",
                  "description": "LocalTuya hat für {device_name} eine mögliche Änderung der LAN-Adresse erkannt, konnte die neue Adresse jedoch nicht mit den gespeicherten lokalen Zugangsdaten verifizieren. Die konfigurierte Adresse wurde nicht geändert.",
                  "fix_flow": {
                      "error": {
                          "cannot_connect": "Das Gerät antwortet unter dieser Adresse nicht. Prüfe, ob es eingeschaltet und von Home Assistant erreichbar ist.",
                          "invalid_auth": "Das Gerät antwortet, aber die gespeicherten lokalen Zugangsdaten wurden abgelehnt. Verknüpfe oder konfiguriere die Gerätezugangsdaten neu und versuche es erneut.",
                          "empty_dps": "Die Geräteverbindung war erfolgreich, aber es wurden keine Datenpunkte zurückgegeben. Versuche es erneut, wenn das Gerät vollständig online ist.",
                          "invalid_host": "Gib eine gültige LAN-IP-Adresse oder einen gültigen Hostnamen ein.",
                          "unknown": "Die Adresse konnte nicht sicher verifiziert werden. Die bestehende Konfiguration blieb unverändert.",
                          "stale": "Die Geräteadresse hat sich während der Verifizierung erneut geändert. Starte die Suche erneut oder gib die aktuelle Adresse manuell ein.",
                          "device_not_found": "Das konfigurierte Gerät wurde bei der LAN-Suche nicht gefunden. Du kannst seine aktuelle Adresse manuell eingeben.",
                          "discovery_unavailable": "Die automatische LAN-Suche ist derzeit nicht verfügbar. Gib die Geräteadresse manuell ein.",
                          "discovery_failed": "Die automatische LAN-Suche ist fehlgeschlagen. Gib die Geräteadresse manuell ein oder versuche es später erneut."
                      },
                      "step": {
                          "init": {
                              "title": "LAN-Verbindung für {device_name} reparieren",
                              "description": "Wähle die automatische Suche oder gib die aktuelle LAN-Adresse des Geräts ein. LocalTuya prüft Geräte-ID, Local Key, Protokoll und Datenpunkte, bevor eine neue Adresse gespeichert wird.",
                              "menu_options": {
                                  "rediscover": "Automatische LAN-Suche erneut ausführen",
                                  "manual_host": "IP-Adresse / Hostnamen manuell eingeben"
                              }
                          },
                          "manual_host": {
                              "title": "Aktuelle LAN-Adresse eingeben",
                              "description": "Gib die aktuelle IP-Adresse oder den Hostnamen von {device_name} ein. Die Adresse wird erst nach einer erfolgreichen authentifizierten LocalTuya-Prüfung gespeichert.",
                              "data": {
                                  "host": "IP-Adresse / Host"
                              }
                          }
                      }
                  }
              },
              "pt-BR": {
                  "title": "O LocalTuya não conseguiu recuperar {device_name} com segurança",
                  "description": "O LocalTuya detectou uma possível mudança de endereço LAN para {device_name}, mas o novo endereço não pôde ser validado com as credenciais locais salvas. O endereço configurado não foi alterado.",
                  "fix_flow": {
                      "error": {
                          "cannot_connect": "O dispositivo não respondeu nesse endereço. Verifique se ele está ligado e acessível pelo Home Assistant.",
                          "invalid_auth": "O dispositivo respondeu, mas as credenciais locais salvas foram rejeitadas. Vincule novamente ou reconfigure as credenciais do dispositivo antes de tentar de novo.",
                          "empty_dps": "A conexão com o dispositivo foi bem-sucedida, mas nenhum datapoint foi retornado. Tente novamente quando o dispositivo estiver totalmente online.",
                          "invalid_host": "Informe um endereço IP da LAN ou nome de host válido.",
                          "unknown": "Não foi possível validar o endereço com segurança. A configuração existente permaneceu inalterada.",
                          "stale": "O endereço do dispositivo mudou novamente durante a validação. Repita a descoberta ou informe manualmente o endereço atual.",
                          "device_not_found": "O dispositivo configurado não foi encontrado durante a descoberta na LAN. Você pode informar manualmente o endereço atual.",
                          "discovery_unavailable": "A descoberta automática na LAN não está disponível no momento. Informe manualmente o endereço do dispositivo.",
                          "discovery_failed": "A descoberta automática na LAN falhou. Informe manualmente o endereço do dispositivo ou tente novamente mais tarde."
                      },
                      "step": {
                          "init": {
                              "title": "Reparar a conexão LAN de {device_name}",
                              "description": "Escolha a redescoberta automática ou informe o endereço LAN atual do dispositivo. O LocalTuya valida ID do dispositivo, local key, protocolo e datapoints antes de salvar qualquer novo endereço.",
                              "menu_options": {
                                  "rediscover": "Repetir descoberta automática na LAN",
                                  "manual_host": "Informar IP / nome de host manualmente"
                              }
                          },
                          "manual_host": {
                              "title": "Informe o endereço LAN atual",
                              "description": "Informe o endereço IP ou nome de host atual de {device_name}. O endereço só será salvo após uma validação autenticada bem-sucedida do LocalTuya.",
                              "data": {
                                  "host": "Endereço IP / Host"
                              }
                          }
                      }
                  }
              },
              "zh-Hans": {
                  "title": "LocalTuya 无法安全恢复 {device_name}",
                  "description": "LocalTuya 检测到 {device_name} 的 LAN 地址可能发生变化，但无法使用已保存的本地凭据验证新地址。当前配置的地址未被修改。",
                  "fix_flow": {
                      "error": {
                          "cannot_connect": "设备在该地址没有响应。请确认设备已开机，并且 Home Assistant 可以访问它。",
                          "invalid_auth": "设备有响应，但已保存的本地凭据被拒绝。请重新关联或重新配置设备凭据后再试。",
                          "empty_dps": "设备连接成功，但没有返回任何数据点。请在设备完全上线后重试。",
                          "invalid_host": "请输入有效的 LAN IP 地址或主机名。",
                          "unknown": "无法安全验证该地址。现有配置保持不变。",
                          "stale": "验证过程中设备地址再次发生变化。请重新发现设备，或手动输入当前地址。",
                          "device_not_found": "LAN 发现过程中未找到已配置的设备。你可以手动输入设备当前地址。",
                          "discovery_unavailable": "当前无法使用自动 LAN 发现。请手动输入设备地址。",
                          "discovery_failed": "自动 LAN 发现失败。请手动输入设备地址，或稍后重试。"
                      },
                      "step": {
                          "init": {
                              "title": "修复 {device_name} 的 LAN 连接",
                              "description": "请选择自动重新发现，或输入设备当前的 LAN 地址。LocalTuya 会在保存任何新地址前验证设备 ID、local key、协议和数据点。",
                              "menu_options": {
                                  "rediscover": "重新执行自动 LAN 发现",
                                  "manual_host": "手动输入 IP 地址 / 主机名"
                              }
                          },
                          "manual_host": {
                              "title": "输入当前 LAN 地址",
                              "description": "请输入 {device_name} 当前的 IP 地址或主机名。只有通过 LocalTuya 的认证验证后才会保存该地址。",
                              "data": {
                                  "host": "IP 地址 / 主机"
                              }
                          }
                      }
                  }
              }
          }

          root = Path("custom_components/localtuya/translations")
          for language, issue in issue_blocks.items():
              path = root / f"{language}.json"
              data = json.loads(path.read_text(encoding="utf-8"))
              issues = data.setdefault("issues", {})
              issues["host_recovery_failed"] = issue
              path.write_text(
                  json.dumps(data, ensure_ascii=False, indent=4) + "\n",
                  encoding="utf-8",
              )
          PY

      - name: Commit translations
        shell: bash
        run: |
          if git diff --quiet -- custom_components/localtuya/translations; then
            echo "No translation changes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add custom_components/localtuya/translations
          git commit -m "Translate interactive host recovery repair flow"
          git push origin HEAD:develop
