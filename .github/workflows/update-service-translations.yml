name: Update service translations

on:
  push:
    branches:
      - develop
    paths:
      - .github/workflows/update-service-translations.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: develop

      - name: Add translated service metadata
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          blocks = {
              "en": {
                  "refresh_device_catalog": {
                      "name": "Refresh device catalog",
                      "description": "Refresh the remote LocalTuya community device catalog."
                  },
                  "export_device_mapping": {
                      "name": "Export device mapping",
                      "description": "Generate a privacy-safe community mapping for a configured LocalTuya device.",
                      "fields": {
                          "device_id": {
                              "name": "Device ID",
                              "description": "Tuya Device ID to export. The ID itself is never included in the exported mapping."
                          }
                      }
                  },
                  "check_device_health": {
                      "name": "Check device health",
                      "description": "Run a bounded privacy-safe LAN, protocol, and datapoint health check for a configured LocalTuya device.",
                      "fields": {
                          "device_id": {
                              "name": "Device ID",
                              "description": "Tuya Device ID to check. The returned report excludes the Device ID, local key, host address, raw datapoint values, and exception messages."
                          }
                      }
                  }
              },
              "it": {
                  "refresh_device_catalog": {
                      "name": "Aggiorna catalogo dispositivi",
                      "description": "Aggiorna il catalogo remoto dei dispositivi della community LocalTuya."
                  },
                  "export_device_mapping": {
                      "name": "Esporta mappatura dispositivo",
                      "description": "Genera una mappatura della community priva di dati sensibili per un dispositivo LocalTuya configurato.",
                      "fields": {
                          "device_id": {
                              "name": "ID dispositivo",
                              "description": "ID Tuya del dispositivo da esportare. L'ID non viene mai incluso nella mappatura esportata."
                          }
                      }
                  },
                  "check_device_health": {
                      "name": "Controlla stato dispositivo",
                      "description": "Esegue un controllo limitato e privo di dati sensibili su LAN, protocollo e datapoint di un dispositivo LocalTuya configurato.",
                      "fields": {
                          "device_id": {
                              "name": "ID dispositivo",
                              "description": "ID Tuya del dispositivo da controllare. Il report restituito esclude ID dispositivo, local key, indirizzo host, valori grezzi dei datapoint e messaggi delle eccezioni."
                          }
                      }
                  }
              },
              "de": {
                  "refresh_device_catalog": {
                      "name": "Gerätekatalog aktualisieren",
                      "description": "Aktualisiert den entfernten LocalTuya-Gerätekatalog der Community."
                  },
                  "export_device_mapping": {
                      "name": "Gerätezuordnung exportieren",
                      "description": "Erstellt eine datenschutzfreundliche Community-Zuordnung für ein konfiguriertes LocalTuya-Gerät.",
                      "fields": {
                          "device_id": {
                              "name": "Geräte-ID",
                              "description": "Tuya-Geräte-ID für den Export. Die ID selbst wird niemals in die exportierte Zuordnung aufgenommen."
                          }
                      }
                  },
                  "check_device_health": {
                      "name": "Gerätezustand prüfen",
                      "description": "Führt eine begrenzte, datenschutzfreundliche Prüfung von LAN, Protokoll und Datenpunkten für ein konfiguriertes LocalTuya-Gerät durch.",
                      "fields": {
                          "device_id": {
                              "name": "Geräte-ID",
                              "description": "Tuya-Geräte-ID für die Prüfung. Der zurückgegebene Bericht enthält weder Geräte-ID noch Local Key, Hostadresse, Rohwerte der Datenpunkte oder Ausnahmemeldungen."
                          }
                      }
                  }
              },
              "pt-BR": {
                  "refresh_device_catalog": {
                      "name": "Atualizar catálogo de dispositivos",
                      "description": "Atualiza o catálogo remoto de dispositivos da comunidade LocalTuya."
                  },
                  "export_device_mapping": {
                      "name": "Exportar mapeamento do dispositivo",
                      "description": "Gera um mapeamento da comunidade com proteção de privacidade para um dispositivo LocalTuya configurado.",
                      "fields": {
                          "device_id": {
                              "name": "ID do dispositivo",
                              "description": "ID Tuya do dispositivo a exportar. O próprio ID nunca é incluído no mapeamento exportado."
                          }
                      }
                  },
                  "check_device_health": {
                      "name": "Verificar integridade do dispositivo",
                      "description": "Executa uma verificação limitada e com proteção de privacidade da LAN, protocolo e datapoints de um dispositivo LocalTuya configurado.",
                      "fields": {
                          "device_id": {
                              "name": "ID do dispositivo",
                              "description": "ID Tuya do dispositivo a verificar. O relatório retornado exclui ID do dispositivo, local key, endereço do host, valores brutos dos datapoints e mensagens de exceção."
                          }
                      }
                  }
              },
              "zh-Hans": {
                  "refresh_device_catalog": {
                      "name": "刷新设备目录",
                      "description": "刷新远程 LocalTuya 社区设备目录。"
                  },
                  "export_device_mapping": {
                      "name": "导出设备映射",
                      "description": "为已配置的 LocalTuya 设备生成保护隐私的社区映射。",
                      "fields": {
                          "device_id": {
                              "name": "设备 ID",
                              "description": "要导出的 Tuya 设备 ID。设备 ID 本身绝不会包含在导出的映射中。"
                          }
                      }
                  },
                  "check_device_health": {
                      "name": "检查设备健康状态",
                      "description": "对已配置的 LocalTuya 设备执行有时间限制且保护隐私的 LAN、协议和数据点健康检查。",
                      "fields": {
                          "device_id": {
                              "name": "设备 ID",
                              "description": "要检查的 Tuya 设备 ID。返回的报告不会包含设备 ID、local key、主机地址、原始数据点值或异常消息。"
                          }
                      }
                  }
              }
          }

          root = Path("custom_components/localtuya/translations")
          for lang, services_to_add in blocks.items():
              path = root / f"{lang}.json"
              data = json.loads(path.read_text(encoding="utf-8"))
              services = data.setdefault("services", {})
              services.update(services_to_add)
              path.write_text(
                  json.dumps(data, ensure_ascii=False, indent=4) + "\n",
                  encoding="utf-8",
              )
          PY

      - name: Commit translations
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add custom_components/localtuya/translations
          git commit -m "Translate catalog mapping and device health services"
          git push origin HEAD:develop
