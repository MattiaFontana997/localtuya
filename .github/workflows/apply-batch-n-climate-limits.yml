name: Apply Batch N Climate Limit Runtime

on:
  push:
    branches: [develop]
    paths: [".github/workflows/apply-batch-n-climate-limits.yml"]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: develop
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Apply Climate limit runtime patch
        run: python _apply_batch_n_climate_limits.py
      - name: Compile patched files
        run: python -m py_compile custom_components/localtuya/const.py custom_components/localtuya/climate.py tests/test_climate_catalog_semantics.py
      - name: Install test dependencies
        run: python -m pip install -r requirements_test.txt
      - name: Run focused Climate tests
        run: python -m unittest tests.test_climate_catalog_semantics tests.test_climate_advanced_metadata -v
      - name: Commit runtime and tests
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add custom_components/localtuya/const.py custom_components/localtuya/climate.py tests/test_climate_catalog_semantics.py
          if git diff --cached --quiet; then
            echo "Batch N Climate limit runtime already applied"
            exit 0
          fi
          git commit -m "Scale dynamic Climate min max temperature DPS"
          git push origin HEAD:develop
