name: Temporary QR onboarding polish

on:
  push:
    branches:
      - feature/qr-onboarding
    paths:
      - .github/workflows/temp-qr-polish.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/qr-onboarding
      - name: Polish QR flow internals
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('custom_components/localtuya/qr_onboarding.py')
          text = path.read_text()

          text = text.replace(
              'from homeassistant.core import callback\n',
              '',
              1,
          )

          marker = '''    @property\n    def auth(self) -> dict[str, Any]:\n        """Return the current account link, including refreshed tokens."""\n        return copy.deepcopy(self._auth)\n\n'''
          replacement = marker + '''    @property\n    def user_code(self) -> str | None:\n        """Return the User Code associated with this QR session."""\n        return self._user_code\n\n'''
          if marker not in text:
              raise SystemExit('auth property marker not found')
          text = text.replace(marker, replacement, 1)

          text = text.replace(
              'await cloud.async_generate_qr(cloud._user_code)',
              'await cloud.async_generate_qr(cloud.user_code)',
              1,
          )

          old = '''        return self.async_show_form(\n            step_id="manual_configure_entity",\n            data_schema=schema_defaults(\n                schema,\n                available,\n            ),\n        )\n'''
          new = '''        return self.async_show_form(\n            step_id="manual_configure_entity",\n            data_schema=schema_defaults(\n                schema,\n                available,\n            ),\n            description_placeholders={\n                "entity": "an entity",\n                "platform": platform,\n            },\n        )\n'''
          if old not in text:
              raise SystemExit('manual configure form marker not found')
          text = text.replace(old, new, 1)

          path.write_text(text)
          Path('.github/workflows/temp-qr-polish.yml').unlink()
          PY
      - name: Commit polish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add custom_components/localtuya/qr_onboarding.py .github/workflows/temp-qr-polish.yml
          git commit -m "Polish QR onboarding flow internals"
          git push origin HEAD:feature/qr-onboarding
