name: Patch residual fan semantics

on:
  push:
    paths:
      - .github/workflows/patch-fan-residual-semantics.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: develop
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Apply patch
        run: python .github/scripts/patch_fan_residual_semantics.py
      - name: Install tox
        run: python -m pip install "tox>=4.20,<5"
      - name: Run full suite
        run: python -m tox -e py314
      - name: Commit runtime support
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add custom_components/localtuya/const.py custom_components/localtuya/fan.py custom_components/localtuya/device_catalog.py tests/test_fan_residual_semantics.py
          git diff --cached --check
          git commit -m "Support fans without power switches and preset fallbacks"
          git push origin HEAD:develop
