name: Temporary targeted discovery patch

on:
  push:
    branches:
      - fix/6.7.0-targeted-discovery

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/6.7.0-targeted-discovery
          fetch-depth: 0
      - name: Apply targeted Device ID discovery parity patch
        shell: python
        run: |
          from pathlib import Path

          discovery_path = Path('custom_components/localtuya/discovery.py')
          discovery = discovery_path.read_text()

          old = '''DEFAULT_TIMEOUT = 6.0\n\nPREFIX_55AA'''
          new = '''DEFAULT_TIMEOUT = 6.0\nTARGETED_DISCOVERY_TIMEOUT = 18.0\nDISCOVERY_REBROADCAST_INTERVAL = 6.0\n\nPREFIX_55AA'''
          if old not in discovery:
              raise SystemExit('discovery constants anchor not found')
          discovery = discovery.replace(old, new, 1)

          old = '''\n\nasync def discover(\n    timeout: float = DEFAULT_TIMEOUT,\n    *,\n    hass: HomeAssistant | None = None,\n) -> dict[str, dict[str, Any]]:\n'''
          new = '''\n\nasync def find_device(\n    device_id: str,\n    *,\n    timeout: float = TARGETED_DISCOVERY_TIMEOUT,\n    rebroadcast_interval: float = DISCOVERY_REBROADCAST_INTERVAL,\n    hass: HomeAssistant | None = None,\n) -> dict[str, Any] | None:\n    \"\"\"Find one Tuya device by Device ID with TinyTuya-style discovery.\n\n    Listen on all Tuya discovery ports, actively request REQ_DEVINFO, resend the\n    request periodically for slow 3.5 devices, and return immediately once the\n    requested Device ID is observed. Cloud/WAN addresses are never consulted.\n    \"\"\"\n    target_id = str(device_id or \"\").strip()\n    if not target_id:\n        return None\n\n    timeout = max(0.0, float(timeout))\n    rebroadcast_interval = max(0.1, float(rebroadcast_interval))\n    matched: dict[str, Any] | None = None\n    found = asyncio.Event()\n\n    def _on_device(device: dict[str, Any]) -> None:\n        nonlocal matched\n        found_id = (\n            device.get(\"gwId\")\n            or device.get(\"id\")\n            or device.get(\"devId\")\n            or device.get(\"deviceId\")\n            or device.get(\"dev_id\")\n        )\n        if str(found_id or \"\").strip() != target_id:\n            return\n        matched = dict(device)\n        found.set()\n\n    discovery = TuyaDiscovery(_on_device, hass=hass)\n    loop = asyncio.get_running_loop()\n\n    try:\n        await discovery.start()\n\n        existing = discovery.devices.get(target_id)\n        if isinstance(existing, dict):\n            return dict(existing)\n        if found.is_set():\n            return dict(matched) if matched is not None else None\n\n        deadline = loop.time() + timeout\n        next_broadcast = loop.time() + rebroadcast_interval\n\n        while loop.time() < deadline:\n            now = loop.time()\n            wait_time = min(\n                max(0.0, deadline - now),\n                max(0.0, next_broadcast - now),\n            )\n            if wait_time <= 0:\n                wait_time = min(0.05, max(0.0, deadline - now))\n\n            try:\n                await asyncio.wait_for(found.wait(), timeout=wait_time)\n            except TimeoutError:\n                pass\n\n            if found.is_set():\n                return dict(matched) if matched is not None else None\n\n            now = loop.time()\n            if now >= next_broadcast and now < deadline:\n                try:\n                    await discovery.async_request_discovery()\n                except Exception as exc:\n                    _LOGGER.debug(\n                        \"Targeted Tuya discovery rebroadcast failed: %s\",\n                        exc,\n                    )\n                next_broadcast = now + rebroadcast_interval\n\n                existing = discovery.devices.get(target_id)\n                if isinstance(existing, dict):\n                    return dict(existing)\n\n        return dict(matched) if matched is not None else None\n    finally:\n        discovery.close()\n\n\nasync def discover(\n    timeout: float = DEFAULT_TIMEOUT,\n    *,\n    hass: HomeAssistant | None = None,\n) -> dict[str, dict[str, Any]]:\n'''
          if old not in discovery:
              raise SystemExit('discover function anchor not found')
          discovery = discovery.replace(old, new, 1)
          discovery_path.write_text(discovery)

          qr_path = Path('custom_components/localtuya/qr_onboarding.py')
          qr = qr_path.read_text()
          old = '''    from .discovery import discover\n\n    try:\n        # TinyTuya/tuya-local use an 18-second discovery window.  Keep\n        # LocalTuya's fast cached/active probes above, but use the same proven\n        # window on this slow fallback so infrequent announcers are not missed.\n        devices = await discover(timeout=18.0, hass=hass)\n    except Exception as exc:\n        _LOGGER.debug(\"Targeted Tuya LAN discovery fallback failed: %s\", exc)\n        return None\n\n    if not isinstance(devices, dict):\n        return None\n    return _find_discovered_device(devices, device_id)\n'''
          new = '''    from .discovery import find_device\n\n    try:\n        # Match the proven TinyTuya/tuya-local find_device(dev_id=...) model:\n        # listen on 6666/6667/7000, periodically rebroadcast REQ_DEVINFO for\n        # slow 3.5 devices, and stop as soon as the requested ID appears.\n        found = await find_device(device_id, hass=hass)\n    except Exception as exc:\n        _LOGGER.debug(\"Targeted Tuya LAN discovery fallback failed: %s\", exc)\n        return None\n\n    return copy.deepcopy(found) if isinstance(found, dict) else None\n'''
          if old not in qr:
              raise SystemExit('qr targeted fallback anchor not found')
          qr = qr.replace(old, new, 1)
          qr_path.write_text(qr)

          test_path = Path('tests/test_targeted_discovery.py')
          test_path.write_text('''\"\"\"Tests for TinyTuya-style targeted Device ID discovery.\"\"\"\n\nimport unittest\nfrom unittest.mock import patch\n\nfrom custom_components.localtuya.discovery import find_device\n\n\nclass _FakeDiscovery:\n    instances = []\n    emit_on_rebroadcast = True\n\n    def __init__(self, callback=None, *, hass=None):\n        self.callback = callback\n        self.hass = hass\n        self.devices = {}\n        self.requests = 0\n        self.closed = False\n        type(self).instances.append(self)\n\n    async def start(self):\n        return None\n\n    async def async_request_discovery(self):\n        self.requests += 1\n        if self.emit_on_rebroadcast and self.requests == 1:\n            payload = {\n                \"gwId\": \"wanted-device\",\n                \"ip\": \"192.168.1.44\",\n                \"version\": \"3.5\",\n            }\n            self.devices[payload[\"gwId\"]] = payload\n            if self.callback is not None:\n                self.callback(payload)\n        return True\n\n    def close(self):\n        self.closed = True\n\n\nclass TargetedDiscoveryTests(unittest.IsolatedAsyncioTestCase):\n    async def asyncSetUp(self):\n        _FakeDiscovery.instances = []\n        _FakeDiscovery.emit_on_rebroadcast = True\n\n    async def test_rebroadcast_finds_target_and_exits_early(self):\n        with patch(\n            \"custom_components.localtuya.discovery.TuyaDiscovery\",\n            _FakeDiscovery,\n        ):\n            result = await find_device(\n                \"wanted-device\",\n                timeout=0.5,\n                rebroadcast_interval=0.02,\n                hass=object(),\n            )\n\n        self.assertEqual(result[\"ip\"], \"192.168.1.44\")\n        instance = _FakeDiscovery.instances[-1]\n        self.assertEqual(instance.requests, 1)\n        self.assertTrue(instance.closed)\n\n    async def test_timeout_returns_none_and_closes_listener(self):\n        _FakeDiscovery.emit_on_rebroadcast = False\n        with patch(\n            \"custom_components.localtuya.discovery.TuyaDiscovery\",\n            _FakeDiscovery,\n        ):\n            result = await find_device(\n                \"missing-device\",\n                timeout=0.06,\n                rebroadcast_interval=0.02,\n                hass=object(),\n            )\n\n        self.assertIsNone(result)\n        instance = _FakeDiscovery.instances[-1]\n        self.assertGreaterEqual(instance.requests, 2)\n        self.assertTrue(instance.closed)\n\n\nif __name__ == \"__main__\":\n    unittest.main()\n''')

          workflow = Path('.github/workflows/targeted-discovery-patch.yml')
          workflow.unlink()
      - name: Commit patch and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add custom_components/localtuya/discovery.py custom_components/localtuya/qr_onboarding.py tests/test_targeted_discovery.py .github/workflows/targeted-discovery-patch.yml
          git commit -m "Match tuya-local targeted LAN discovery"
          git push origin HEAD:fix/6.7.0-targeted-discovery
