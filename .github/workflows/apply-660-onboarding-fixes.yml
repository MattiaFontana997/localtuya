name: Apply 6.6.0 onboarding fixes

on:
  push:
    branches: [fix/6.6.0-gateway-lan-onboarding]
    paths: [.github/workflows/apply-660-onboarding-fixes.yml]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/6.6.0-gateway-lan-onboarding
      - name: Patch QR onboarding
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('custom_components/localtuya/qr_onboarding.py')
          s = p.read_text()

          old = '''            devices[device_id] = {
                "id": device_id,
                CONF_NAME: str(getattr(device, "name", "") or "").strip(),
                CONF_LOCAL_KEY: local_key,
                "product_id": product_id,
                "product_name": str(
                    getattr(device, "product_name", "") or ""
                ).strip(),
                "category": str(getattr(device, "category", "") or "").strip(),
                "online": bool(getattr(device, "online", False)),
                "support_local": bool(getattr(device, "support_local", False)),
                "node_id": node_id,
            }
'''
          new = '''            devices[device_id] = {
                "id": device_id,
                CONF_NAME: str(getattr(device, "name", "") or "").strip(),
                CONF_LOCAL_KEY: local_key,
                "product_id": product_id,
                "product_name": str(
                    getattr(device, "product_name", "") or ""
                ).strip(),
                "category": str(getattr(device, "category", "") or "").strip(),
                "online": bool(getattr(device, "online", False)),
                "support_local": bool(getattr(device, "support_local", False)),
                "node_id": node_id,
                # Device Sharing exposes node_id on some gateway records too.
                # Keep the SDK's explicit relationship metadata so onboarding
                # never mistakes "has a node_id" for "is a child device".
                "sub": bool(getattr(device, "sub", False)),
                "uuid": str(getattr(device, "uuid", "") or "").strip(),
                "model": str(getattr(device, "model", "") or "").strip(),
            }
'''
          assert old in s
          s = s.replace(old, new, 1)

          marker = '''def _qr_host_schema(default: str = "") -> vol.Schema:
'''
          helper = '''def _is_gateway_device(device: dict[str, Any]) -> bool:
    """Return whether sharing metadata describes a Tuya LAN gateway/hub.

    A node_id alone is not sufficient: Tuya Device Sharing can expose node_id
    even on Wi-Fi gateway records.  Categories beginning with ``wg`` are Tuya
    gateways; product names/models provide a conservative fallback for vendors
    using a custom category.
    """
    category = str(device.get("category") or "").strip().lower()
    if category.startswith("wg"):
        return True
    text = " ".join(
        str(device.get(key) or "").lower()
        for key in (CONF_NAME, "product_name", "model")
    )
    return any(word in text for word in ("gateway", "wi-fi hub", "wifi hub"))


def _is_child_device(device: dict[str, Any]) -> bool:
    """Return whether a sharing record is a real gateway child device."""
    if _is_gateway_device(device):
        return False
    return bool(device.get("node_id")) and bool(device.get("sub", True))


def _discovery_by_host(
    devices: dict[str, dict[str, Any]], host: str
) -> dict[str, Any] | None:
    """Find cached discovery metadata by LAN address without trusting identity."""
    host = str(host or "").strip()
    if not host:
        return None
    matches = [
        copy.deepcopy(candidate)
        for candidate in devices.values()
        if isinstance(candidate, dict)
        and str(candidate.get("ip") or "").strip() == host
    ]
    # Never guess if more than one discovery record claims the same address.
    return matches[0] if len(matches) == 1 else None


def _discovered_protocol_hint(discovered: dict[str, Any]) -> str:
    """Return a trusted Tuya protocol hint from LAN discovery when available."""
    version = str(discovered.get("version") or "").strip()
    return version if version in {"3.1", "3.2", "3.3", "3.4", "3.5"} else "auto"


'''
          assert marker in s
          s = s.replace(marker, helper + marker, 1)

          old = '''    if cloud_device.get("node_id"):
        raise QrProvisioningError(
            "qr_subdevice_not_supported",
            "The selected device is a hub child device",
        )
'''
          new = '''    if _is_child_device(cloud_device):
        raise QrProvisioningError(
            "qr_subdevice_not_supported",
            "The selected device is a hub child device",
        )
'''
          assert old in s
          s = s.replace(old, new, 1)

          old = '''    else:
        host = str(host_override or "").strip()
        if not host:
            raise QrProvisioningError(
                "qr_device_host_required",
                "Enter the current device IP address or hostname",
            )
        discovered = {
            "gwId": device_id,
            "ip": host,
        }
'''
          new = '''    else:
        host = str(host_override or "").strip()
        if not host:
            raise QrProvisioningError(
                "qr_device_host_required",
                "Enter the current device IP address or hostname",
            )

        # Manual address entry must remain usable when UDP discovery is blocked,
        # but reuse an already-cached discovery record when it matches the host.
        # In particular this preserves the device-advertised protocol version and
        # avoids probing 3.5 first against an older 3.3 thermostat.
        cached = hass.data.get(DOMAIN, {}).get(DATA_DISCOVERY)
        cached_devices = getattr(cached, "devices", {}) if cached is not None else {}
        by_host = _discovery_by_host(cached_devices, host) if isinstance(cached_devices, dict) else None
        discovered = by_host or {
            "gwId": device_id,
            "ip": host,
        }
'''
          assert old in s
          s = s.replace(old, new, 1)

          old = '''        CONF_PROTOCOL_VERSION: PROTOCOL_AUTO,
'''
          new = '''        # UDP discovery carries the protocol version. Prefer that exact
        # version over destructive trial-and-error probing when available.
        CONF_PROTOCOL_VERSION: _discovered_protocol_hint(discovered),
'''
          assert old in s
          s = s.replace(old, new, 1)

          old = '''        eligible = {
            device_id: device
            for device_id, device in devices.items()
            if device.get(CONF_LOCAL_KEY)
            and not device.get("node_id")
            and device.get("support_local", True)
        }
'''
          new = '''        eligible = {
            device_id: device
            for device_id, device in devices.items()
            if device.get(CONF_LOCAL_KEY)
            and device.get("support_local", True)
            and not _is_child_device(device)
        }
'''
          assert old in s
          s = s.replace(old, new, 1)

          p.write_text(s)
          PY
      - name: Commit patch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add custom_components/localtuya/qr_onboarding.py
          git commit -m 'Fix gateway classification and reuse LAN protocol hints'
          git push origin HEAD:fix/6.6.0-gateway-lan-onboarding
