name: Apply Batch N Mapped Extra Runtime

on:
  push:
    branches: [develop]
    paths: [".github/workflows/apply-batch-n-mapped-extras.yml"]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: develop
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: python _apply_batch_n_mapped_extras.py
      - run: python -m py_compile custom_components/localtuya/const.py custom_components/localtuya/common.py tests/test_mapped_extra_attributes.py
      - run: python -m pip install -r requirements_test.txt
      - name: Run focused mapped-extra tests
        run: python -m unittest tests.test_mapped_extra_attributes tests.test_advanced_mapping_v2 -v
      - name: Commit runtime and tests
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add custom_components/localtuya/const.py custom_components/localtuya/common.py tests/test_mapped_extra_attributes.py
          if git diff --cached --quiet; then
            echo "Mapped extra runtime already applied"
            exit 0
          fi
          git commit -m "Support mapped catalog extra state attributes"
          git push origin HEAD:develop
