name: Cleanup stale branches

on:
  push:
    branches: [develop]
    paths:
      - .github/workflows/cleanup-stale-branches.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: develop
          fetch-depth: 0
      - name: Delete obsolete remote branches
        run: |
          git push origin --delete \
            docs/qr-setup-screenshots \
            feature/qr-onboarding \
            __noop_should_not_create \
            release/6.6.0
      - name: Remove temporary cleanup workflow
        run: |
          git rm .github/workflows/cleanup-stale-branches.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Remove temporary branch cleanup workflow"
          git push origin HEAD:develop
