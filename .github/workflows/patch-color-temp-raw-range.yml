name: Fix independent color temperature raw range

on:
  push:
    branches:
      - compat/light-color-temp-raw-range
    paths:
      - .github/workflows/patch-color-temp-raw-range.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: compat/light-color-temp-raw-range
          fetch-depth: 0

      - name: Correct generated Python blocks
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          light = Path("custom_components/localtuya/light.py")
          text = light.read_text()
          start = text.index("    def _raw_color_temp_to_kelvin(self, value) -> int | None:\n")
          end = text.index("    def _decode_color(self, raw_color):\n", start)
          lines = [
              "    def _raw_color_temp_to_kelvin(self, value) -> int | None:",
              "        \"\"\"Convert a Tuya color-temperature DP to Kelvin.\"\"\"",
              "        if value is None or isinstance(value, bool):",
              "            return None", "",
              "        discrete = getattr(self, \"_color_temp_values\", [])",
              "        if discrete:",
              "            try:", "                raw_value = int(value)",
              "            except (TypeError, ValueError):", "                return None",
              "            for kelvin, configured_raw in discrete:",
              "                if raw_value == configured_raw:", "                    return kelvin",
              "            return None", "",
              "        try:", "            raw_value = float(value)",
              "        except (TypeError, ValueError):", "            return None", "",
              "        raw_lower = getattr(self, \"_raw_color_temp_lower\", 0)",
              "        raw_upper = getattr(", "            self,", "            \"_raw_color_temp_upper\",",
              "            getattr(", "                self,", "                \"_raw_color_temp_max\",",
              "                getattr(self, \"_upper_brightness\", DEFAULT_UPPER_BRIGHTNESS),",
              "            ),", "        )",
              "        if raw_upper <= raw_lower:", "            return None", "",
              "        raw_value = min(max(raw_value, raw_lower), raw_upper)",
              "        if self._color_temp_reverse:", "            raw_value = raw_lower + raw_upper - raw_value", "",
              "        ratio = (raw_value - raw_lower) / (raw_upper - raw_lower)",
              "        mired = self._max_mired - ((self._max_mired - self._min_mired) * ratio)",
              "        kelvin = color_util.color_temperature_mired_to_kelvin(mired)",
              "        return min(max(kelvin, self._min_kelvin), self._max_kelvin)", "",
              "    def _kelvin_to_raw_color_temp(self, kelvin) -> int:",
              "        \"\"\"Convert a Kelvin color temperature to Tuya DP format.\"\"\"",
              "        kelvin = min(max(int(kelvin), self._min_kelvin), self._max_kelvin)", "",
              "        discrete = getattr(self, \"_color_temp_values\", [])",
              "        if discrete:", "            best_raw = discrete[0][1]",
              "            best_distance = abs(discrete[0][0] - kelvin)",
              "            for configured_kelvin, raw_value in discrete[1:]:",
              "                distance = abs(configured_kelvin - kelvin)",
              "                if distance < best_distance:", "                    best_raw = raw_value",
              "                    best_distance = distance", "            return best_raw", "",
              "        raw_lower = getattr(self, \"_raw_color_temp_lower\", 0)",
              "        raw_upper = getattr(", "            self,", "            \"_raw_color_temp_upper\",",
              "            getattr(", "                self,", "                \"_raw_color_temp_max\",",
              "                getattr(self, \"_upper_brightness\", DEFAULT_UPPER_BRIGHTNESS),",
              "            ),", "        )",
              "        if raw_upper <= raw_lower:", "            return round(raw_lower)", "",
              "        mired = color_util.color_temperature_kelvin_to_mired(kelvin)",
              "        ratio = (self._max_mired - mired) / (self._max_mired - self._min_mired)",
              "        raw_value = round(raw_lower + ratio * (raw_upper - raw_lower))",
              "        raw_value = min(max(raw_value, raw_lower), raw_upper)", "",
              "        if self._color_temp_reverse:", "            raw_value = raw_lower + raw_upper - raw_value", "",
              "        step = getattr(self, \"_color_temp_step\", 1)",
              "        if step != 1:",
              "            raw_value = raw_lower + step * round(float(raw_value - raw_lower) / step)",
              "            raw_value = min(max(raw_value, raw_lower), raw_upper)", "",
              "        return round(raw_value)", "", "",
          ]
          light.write_text(text[:start] + "\n".join(lines) + text[end:])

          tests = Path("tests/test_light_residual_runtime.py")
          text = tests.read_text()
          start = text.index("    def test_color_temperature_uses_independent_raw_range(self):\n")
          end = text.index("    def test_extended_rgbhsv_scales_saturation_and_value(self):\n", start)
          lines = [
              "    def test_color_temperature_uses_independent_raw_range(self):",
              "        light = self._light({\"color_temp_lower\": 100, \"color_temp_upper\": 1100})",
              "        self.assertEqual(light._kelvin_to_raw_color_temp(2700), 100)",
              "        self.assertEqual(light._kelvin_to_raw_color_temp(6500), 1100)",
              "        self.assertEqual(light._raw_color_temp_to_kelvin(100), 2700)",
              "        self.assertEqual(light._raw_color_temp_to_kelvin(1100), 6500)", "",
              "    def test_color_temperature_reverse_respects_both_raw_bounds(self):",
              "        light = self._light({",
              "            \"color_temp_lower\": 100,", "            \"color_temp_upper\": 1100,",
              "            \"color_temp_reverse\": True,", "        })",
              "        self.assertEqual(light._kelvin_to_raw_color_temp(2700), 1100)",
              "        self.assertEqual(light._kelvin_to_raw_color_temp(6500), 100)",
              "        self.assertEqual(light._raw_color_temp_to_kelvin(100), 6500)",
              "        self.assertEqual(light._raw_color_temp_to_kelvin(1100), 2700)", "",
              "    def test_color_temperature_step_is_relative_to_raw_minimum(self):",
              "        light = self._light({", "            \"color_temp_lower\": 5,",
              "            \"color_temp_upper\": 105,", "            \"color_temp_step\": 10,", "        })",
              "        self.assertEqual(light._kelvin_to_raw_color_temp(2700), 5)",
              "        self.assertEqual(light._kelvin_to_raw_color_temp(6500), 105)", "", "",
          ]
          tests.write_text(text[:start] + "\n".join(lines) + text[end:])
          PY

      - name: Verify Python syntax
        shell: bash
        run: |
          python -m compileall custom_components/localtuya/light.py tests/test_light_residual_runtime.py tests/test_light_brightness_step.py

      - name: Commit correction
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add custom_components/localtuya/light.py tests/test_light_residual_runtime.py
          git diff --cached --check
          git commit -m "Fix independent color temperature range tests"
          git push origin HEAD:compat/light-color-temp-raw-range
