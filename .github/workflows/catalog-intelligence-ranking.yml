name: Strengthen catalog intelligence

on:
  push:
    branches:
      - develop
    paths:
      - .github/workflows/catalog-intelligence-ranking.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
      - run: python .github/scripts/catalog_ranking.py
      - run: python -m compileall -q custom_components/localtuya/device_catalog.py
      - run: git diff --check
      - run: |
          git rm .github/workflows/catalog-intelligence-ranking.yml .github/scripts/catalog_ranking.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add custom_components/localtuya/device_catalog.py
          git commit -m "Make catalog matching authority deterministic"
          git push origin HEAD:develop
