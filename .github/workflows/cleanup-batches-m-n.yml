name: Cleanup Temporary Batch Tooling

on:
  push:
    branches: [develop]
    paths: [".github/workflows/cleanup-batches-m-n.yml"]

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: develop
      - name: Remove completed one-shot runtime tooling
        run: |
          rm -f \
            .github/workflows/apply-batch-m-advanced-runtime.yml \
            .github/workflows/apply-batch-n-climate-limits.yml \
            .github/workflows/apply-batch-n-mapped-extras.yml \
            .github/workflows/cleanup-batches-m-n.yml \
            _apply_batch_m_advanced_runtime.py \
            _apply_batch_n_climate_limits.py \
            _apply_batch_n_mapped_extras.py
      - name: Commit cleanup
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Remove temporary completed batch tooling"
          git push origin HEAD:develop
