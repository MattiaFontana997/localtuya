name: Patch 6.6.0 gateway and LAN onboarding

on:
  push:
    branches:
      - "fix/6.6.0-gateway-lan-onboarding"
    paths:
      - ".github/workflows/patch-660-gateway-lan.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/6.6.0-gateway-lan-onboarding
      - name: Patch LocalTuya
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              if old not in text:
                  raise SystemExit(f"pattern not found in {path}: {old[:100]!r}")
              p.write_text(text.replace(old, new, 1), encoding="utf-8")

          path = "custom_components/localtuya/pytuya/__init__.py"
          replace(path,
              "    def __init__(\n        self, dev_id, local_key, protocol_version, enable_debug, on_connected, listener\n    ):",
              "    def __init__(\n        self,\n        dev_id,\n        local_key,\n        protocol_version,\n        enable_debug,\n        on_connected,\n        listener,\n        cid=None,\n        gateway_id=None,\n    ):")
          replace(path,
              "        self.id = dev_id\n        self.local_key = local_key.encode(\"latin1\")",
              "        self.id = dev_id\n        self.cid = str(cid or \"\").strip() or None\n        self.gateway_id = str(gateway_id or \"\").strip() or None\n        self.local_key = local_key.encode(\"latin1\")")
          replace(path,
              "        if \"t\" in json_data:\n            if json_data[\"t\"] == \"int\":",
              "        if self.cid:\n            json_data[\"cid\"] = self.cid\n            if self.gateway_id and \"gwId\" in json_data:\n                json_data[\"gwId\"] = self.gateway_id\n            if self.version >= 3.4:\n                nested = json_data.get(\"data\")\n                if not isinstance(nested, dict):\n                    nested = {}\n                    json_data[\"data\"] = nested\n                nested[\"cid\"] = self.cid\n                nested[\"ctype\"] = 0\n\n        if \"t\" in json_data:\n            if json_data[\"t\"] == \"int\":")
          replace(path,
              "            elif \"data\" in json_data:\n                json_data[\"data\"] = {\"dps\": data}",
              "            elif \"data\" in json_data:\n                if not isinstance(json_data[\"data\"], dict):\n                    json_data[\"data\"] = {}\n                json_data[\"data\"][\"dps\"] = data")
          replace(path,
              "            and \"data\" in json_payload\n            and \"dps\" in json_payload[\"data\"]\n        ):\n            json_payload[\"dps\"] = json_payload[\"data\"][\"dps\"]\n\n        return json_payload",
              "            and \"data\" in json_payload\n            and isinstance(json_payload[\"data\"], dict)\n            and \"dps\" in json_payload[\"data\"]\n        ):\n            json_payload[\"dps\"] = json_payload[\"data\"][\"dps\"]\n\n        if self.cid:\n            received_cid = json_payload.get(\"cid\")\n            nested = json_payload.get(\"data\")\n            if not received_cid and isinstance(nested, dict):\n                received_cid = nested.get(\"cid\")\n            if received_cid and str(received_cid) != self.cid:\n                json_payload.pop(\"dps\", None)\n\n        return json_payload")
          replace(path,
              "    listener=None,\n    port=6668,\n    timeout=5,\n):",
              "    listener=None,\n    port=6668,\n    timeout=5,\n    cid=None,\n    gateway_id=None,\n):")
          replace(path,
              "            listener or EmptyListener(),\n        ),",
              "            listener or EmptyListener(),\n            cid=cid,\n            gateway_id=gateway_id,\n        ),")

          path = "custom_components/localtuya/config_flow.py"
          replace(path,
              "            interface = await pytuya.connect(\n                data[CONF_HOST],\n                data[CONF_DEVICE_ID],\n                data[CONF_LOCAL_KEY],\n                float(protocol_version),\n                data.get(CONF_ENABLE_DEBUG, False),\n            )",
              "            last_connect_error = None\n            for attempt in range(2):\n                try:\n                    interface = await pytuya.connect(\n                        data[CONF_HOST],\n                        data[CONF_DEVICE_ID],\n                        data[CONF_LOCAL_KEY],\n                        float(protocol_version),\n                        data.get(CONF_ENABLE_DEBUG, False),\n                        cid=data.get(\"node_id\"),\n                        gateway_id=data.get(\"gateway_id\"),\n                    )\n                    break\n                except (ConnectionRefusedError, ConnectionResetError, OSError, TimeoutError) as ex:\n                    last_connect_error = ex\n                    if attempt == 0:\n                        await asyncio.sleep(0.35)\n            if interface is None and last_connect_error is not None:\n                raise last_connect_error")

          path = "custom_components/localtuya/common.py"
          replace(path,
              "                self._local_key, float(self._dev_config_entry[CONF_PROTOCOL_VERSION]),\n                self._dev_config_entry.get(CONF_ENABLE_DEBUG, False), self,\n            )",
              "                self._local_key, float(self._dev_config_entry[CONF_PROTOCOL_VERSION]),\n                self._dev_config_entry.get(CONF_ENABLE_DEBUG, False), self,\n                cid=self._dev_config_entry.get(\"node_id\"),\n                gateway_id=self._dev_config_entry.get(\"gateway_id\"),\n            )")

          path = "custom_components/localtuya/qr_onboarding.py"
          replace(path,
              "            node_id = str(getattr(device, \"node_id\", \"\") or \"\").strip()\n\n            devices[device_id] = {",
              "            node_id = str(getattr(device, \"node_id\", \"\") or \"\").strip()\n            gateway_id = str(\n                getattr(device, \"gateway_id\", \"\")\n                or getattr(device, \"gatewayId\", \"\")\n                or getattr(device, \"parent_id\", \"\")\n                or \"\"\n            ).strip()\n            device_ip = str(getattr(device, \"ip\", \"\") or \"\").strip()\n\n            devices[device_id] = {")
          replace(path,
              "                \"support_local\": bool(getattr(device, \"support_local\", False)),\n                \"node_id\": node_id,\n            }\n\n        return devices",
              "                \"support_local\": bool(getattr(device, \"support_local\", False)),\n                \"node_id\": node_id,\n                \"gateway_id\": gateway_id,\n                \"ip\": device_ip,\n            }\n\n        for device in devices.values():\n            gateway_id = device.get(\"gateway_id\")\n            if not device.get(\"node_id\") or not gateway_id:\n                continue\n            gateway = devices.get(gateway_id)\n            if not isinstance(gateway, dict):\n                continue\n            device[\"gateway_local_key\"] = gateway.get(CONF_LOCAL_KEY) or \"\"\n            device[\"gateway_ip\"] = gateway.get(\"ip\") or \"\"\n            device[\"gateway_name\"] = gateway.get(CONF_NAME) or gateway_id\n\n        return devices")
          replace(path,
              "    device_id = str(cloud_device.get(\"id\") or \"\").strip()\n    local_key = str(cloud_device.get(CONF_LOCAL_KEY) or \"\").strip()",
              "    device_id = str(cloud_device.get(\"id\") or \"\").strip()\n    node_id = str(cloud_device.get(\"node_id\") or \"\").strip()\n    gateway_id = str(cloud_device.get(\"gateway_id\") or \"\").strip()\n    local_key = str(\n        cloud_device.get(CONF_LOCAL_KEY)\n        or cloud_device.get(\"gateway_local_key\")\n        or \"\"\n    ).strip()")
          replace(path,
              "    if cloud_device.get(\"node_id\"):\n        raise QrProvisioningError(\n            \"qr_subdevice_not_supported\",\n            \"The selected device is a hub child device\",\n        )\n    if not cloud_device.get(\"support_local\", True):\n        raise QrProvisioningError(\n            \"qr_device_not_local\",\n            \"Tuya marks this device as cloud-only\",\n        )",
              "    if node_id and not gateway_id:\n        raise QrProvisioningError(\n            \"qr_subdevice_gateway_missing\",\n            \"Tuya returned a child device without its parent gateway ID\",\n        )")
          replace(path,
              "        found = _find_discovered_device(discovered_devices, device_id)",
              "        discovery_id = gateway_id if node_id else device_id\n        found = _find_discovered_device(discovered_devices, discovery_id)")
          replace(path,
              "        host = str(discovered.get(\"ip\") or \"\").strip()",
              "        host = str(\n            discovered.get(\"ip\")\n            or (cloud_device.get(\"gateway_ip\") if node_id else cloud_device.get(\"ip\"))\n            or \"\"\n        ).strip()")
          replace(path,
              "            \"gwId\": device_id,",
              "            \"gwId\": gateway_id or device_id,")
          replace(path,
              "        \"product_id\": cloud_device.get(\"product_id\") or \"\",\n    }",
              "        \"product_id\": cloud_device.get(\"product_id\") or \"\",\n    }\n    if node_id:\n        device_data[\"node_id\"] = node_id\n        device_data[\"gateway_id\"] = gateway_id")
          replace(path,
              "        eligible = {\n            device_id: device\n            for device_id, device in devices.items()\n            if device.get(CONF_LOCAL_KEY)\n            and not device.get(\"node_id\")\n            and device.get(\"support_local\", True)\n        }",
              "        eligible = {\n            device_id: device\n            for device_id, device in devices.items()\n            if (\n                device.get(CONF_LOCAL_KEY)\n                or (\n                    device.get(\"node_id\")\n                    and device.get(\"gateway_id\")\n                    and device.get(\"gateway_local_key\")\n                )\n            )\n        }")
          PY
      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add custom_components/localtuya
          git commit -m "Support gateway children and harden QR LAN onboarding"
          git push origin HEAD:fix/6.6.0-gateway-lan-onboarding
