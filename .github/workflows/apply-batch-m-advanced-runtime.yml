name: Apply Batch M Advanced Runtime

on:
  push:
    branches: [develop]
    paths: [".github/workflows/apply-batch-m-advanced-runtime.yml"]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: develop
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Apply runtime patch
        run: python _apply_batch_m_advanced_runtime.py
      - name: Compile runtime
        run: python -m py_compile custom_components/localtuya/advanced_mapping.py custom_components/localtuya/common.py custom_components/localtuya/climate.py custom_components/localtuya/number.py custom_components/localtuya/water_heater.py tests/test_advanced_mapping_v2.py
      - name: Install test dependencies
        run: python -m pip install -r requirements_test.txt
      - name: Run focused advanced mapping tests
        run: |
          python -m unittest tests.test_advanced_mapping tests.test_advanced_mapping_v2 tests.test_water_heater_advanced_mapping -v
      - name: Commit runtime and tests
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add custom_components/localtuya/advanced_mapping.py custom_components/localtuya/common.py custom_components/localtuya/climate.py custom_components/localtuya/number.py custom_components/localtuya/water_heater.py tests/test_advanced_mapping_v2.py
          if git diff --cached --quiet; then
            echo "Batch M runtime already applied"
            exit 0
          fi
          git commit -m "Add dynamic advanced mapping metadata runtime"
          git push origin HEAD:develop
