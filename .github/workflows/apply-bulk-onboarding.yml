name: Apply bulk onboarding

on:
  push:
    branches: [develop]
    paths:
      - scripts/_bulk_patch.py
      - .github/workflows/apply-bulk-onboarding.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
      - run: python scripts/_bulk_patch.py
      - run: python -m compileall -q custom_components/localtuya/qr_onboarding.py tests/test_bulk_onboarding.py
      - run: |
          git rm scripts/_bulk_patch.py .github/workflows/apply-bulk-onboarding.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add custom_components/localtuya/qr_onboarding.py tests/test_bulk_onboarding.py
          git commit -m "Add sequential QR bulk onboarding"
          git push origin HEAD:develop
