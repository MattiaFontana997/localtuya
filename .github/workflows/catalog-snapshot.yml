name: Catalog snapshot

on:
  workflow_dispatch:
  push:
    branches: [develop]
    paths:
      - custom_components/localtuya/builtin_catalog.json
      - custom_components/localtuya/compatibility_matrix.py
      - scripts/build_catalog_snapshot.py
      - scripts/generate_compatibility_matrix.py
      - .github/workflows/catalog-snapshot.yml

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Validate compatibility matrix generator
        run: |
          python scripts/generate_compatibility_matrix.py \
            --catalog custom_components/localtuya/builtin_catalog.json \
            --json-out /tmp/compatibility_matrix.json \
            --markdown-out /tmp/COMPATIBILITY_MATRIX.md
          diff -u docs/compatibility_matrix.json /tmp/compatibility_matrix.json
          diff -u docs/COMPATIBILITY_MATRIX.md /tmp/COMPATIBILITY_MATRIX.md
