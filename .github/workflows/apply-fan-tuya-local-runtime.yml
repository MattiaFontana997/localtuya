name: Apply fan Tuya Local runtime support

on:
  push:
    branches:
      - fan-tuya-local-runtime

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fan-tuya-local-runtime
          fetch-depth: 0

      - name: Patch runtime and tests
        run: |
          python - <<'PY'
          from pathlib import Path

          const = Path('custom_components/localtuya/const.py')
          text = const.read_text()
          anchor = 'CONF_FAN_DPS_TYPE = "fan_dps_type"\n'
          addition = '''CONF_FAN_DPS_TYPE = "fan_dps_type"\nCONF_FAN_PRESET_DP = "fan_preset_dp"\nCONF_FAN_PRESET_VALUES = "fan_preset_values"\nCONF_FAN_OSCILLATING_ON = "fan_oscillating_on"\nCONF_FAN_OSCILLATING_OFF = "fan_oscillating_off"\n'''
          if 'CONF_FAN_PRESET_DP' not in text:
              assert anchor in text
              text = text.replace(anchor, addition, 1)
              const.write_text(text)

          fan = Path('custom_components/localtuya/fan.py')
          text = fan.read_text()
          old = '''    CONF_FAN_DIRECTION_REV,\n    CONF_FAN_DPS_TYPE,\n    CONF_FAN_ORDERED_LIST,\n    CONF_FAN_OSCILLATING_CONTROL,\n    CONF_FAN_SPEED_CONTROL,\n'''
          new = '''    CONF_FAN_DIRECTION_REV,\n    CONF_FAN_DPS_TYPE,\n    CONF_FAN_ORDERED_LIST,\n    CONF_FAN_OSCILLATING_CONTROL,\n    CONF_FAN_OSCILLATING_OFF,\n    CONF_FAN_OSCILLATING_ON,\n    CONF_FAN_PRESET_DP,\n    CONF_FAN_PRESET_VALUES,\n    CONF_FAN_SPEED_CONTROL,\n'''
          if 'CONF_FAN_PRESET_DP,' not in text:
              assert old in text
              text = text.replace(old, new, 1)

          old = '''        self._attr_percentage = None\n        self._attr_oscillating = None\n        self._attr_current_direction = None\n\n        speed_min = int(\n'''
          new = '''        self._attr_percentage = None\n        self._attr_oscillating = None\n        self._attr_current_direction = None\n        self._attr_preset_mode = None\n\n        self._preset_values = self._configured_preset_values()\n        self._preset_raw_to_name = {\n            raw: name for name, raw in self._preset_values.items()\n        }\n        self._attr_preset_modes = (\n            list(self._preset_values) if self._preset_values else None\n        )\n        self._oscillating_on = self._config.get(\n            CONF_FAN_OSCILLATING_ON, True\n        )\n        self._oscillating_off = self._config.get(\n            CONF_FAN_OSCILLATING_OFF, False\n        )\n\n        speed_min = int(\n'''
          if 'self._preset_values = self._configured_preset_values()' not in text:
              assert old in text
              text = text.replace(old, new, 1)

          old = '''        if self.has_config(CONF_FAN_DIRECTION):\n            features |= FanEntityFeature.DIRECTION\n\n        self._attr_supported_features = features\n'''
          new = '''        if self.has_config(CONF_FAN_DIRECTION):\n            features |= FanEntityFeature.DIRECTION\n\n        if self.has_config(CONF_FAN_PRESET_DP) and self._preset_values:\n            features |= FanEntityFeature.PRESET_MODE\n\n        self._attr_supported_features = features\n'''
          if 'FanEntityFeature.PRESET_MODE' not in text:
              assert old in text
              text = text.replace(old, new, 1)

          marker = '''    @property\n    def is_on(self) -> bool | None:\n'''
          helper = '''    def _configured_preset_values(self) -> dict[str, str]:\n        """Return valid catalog-provided friendly -> raw fan presets."""\n        configured = self._config.get(CONF_FAN_PRESET_VALUES)\n        if configured is None:\n            return {}\n        if not isinstance(configured, dict):\n            self.warning("Invalid fan_preset_values config; ignoring presets")\n            return {}\n\n        result: dict[str, str] = {}\n        raw_values: set[str] = set()\n        for name, raw in configured.items():\n            if (\n                not isinstance(name, str)\n                or not name.strip()\n                or not isinstance(raw, str)\n                or not raw\n            ):\n                self.warning("Ignoring invalid fan preset %r: %r", name, raw)\n                continue\n            name = name.strip()\n            if name in result or raw in raw_values:\n                self.warning("Ignoring duplicate fan preset %r: %r", name, raw)\n                continue\n            result[name] = raw\n            raw_values.add(raw)\n        return result\n\n    @property\n    def is_on(self) -> bool | None:\n'''
          if 'def _configured_preset_values' not in text:
              assert marker in text
              text = text.replace(marker, helper, 1)

          old = '''        if (\n            percentage is not None\n            and self.has_config(CONF_FAN_SPEED_CONTROL)\n        ):\n            if percentage <= 0:\n                await self.async_turn_off()\n                return\n\n            states[self._config[CONF_FAN_SPEED_CONTROL]] = (\n                self._percentage_to_raw(percentage)\n            )\n\n        await self._device.set_dps(states)\n'''
          new = '''        if (\n            percentage is not None\n            and self.has_config(CONF_FAN_SPEED_CONTROL)\n        ):\n            if percentage <= 0:\n                await self.async_turn_off()\n                return\n\n            states[self._config[CONF_FAN_SPEED_CONTROL]] = (\n                self._percentage_to_raw(percentage)\n            )\n\n        if preset_mode is not None and self.has_config(CONF_FAN_PRESET_DP):\n            raw_preset = self._preset_values.get(preset_mode)\n            if raw_preset is None:\n                self.warning("Unsupported fan preset %r", preset_mode)\n            else:\n                states[self._config[CONF_FAN_PRESET_DP]] = raw_preset\n\n        await self._device.set_dps(states)\n'''
          if 'raw_preset = self._preset_values.get(preset_mode)' not in text:
              assert old in text
              text = text.replace(old, new, 1)

          old = '''        await self._device.set_dp(\n            bool(oscillating),\n            self._config[CONF_FAN_OSCILLATING_CONTROL],\n        )\n\n    async def async_set_direction(\n'''
          new = '''        await self._device.set_dp(\n            self._oscillating_on if oscillating else self._oscillating_off,\n            self._config[CONF_FAN_OSCILLATING_CONTROL],\n        )\n\n    async def async_set_preset_mode(self, preset_mode: str) -> None:\n        """Set a catalog-provided Tuya fan preset."""\n        if not self.has_config(CONF_FAN_PRESET_DP):\n            return\n        raw = self._preset_values.get(preset_mode)\n        if raw is None:\n            self.warning("Unsupported fan preset %r", preset_mode)\n            return\n        await self._device.set_dp(raw, self._config[CONF_FAN_PRESET_DP])\n\n    async def async_set_direction(\n'''
          if 'async def async_set_preset_mode' not in text:
              assert old in text
              text = text.replace(old, new, 1)

          old = '''        if self.has_config(CONF_FAN_OSCILLATING_CONTROL):\n            value = self.dps_conf(\n                CONF_FAN_OSCILLATING_CONTROL\n            )\n\n            if isinstance(value, bool):\n                self._attr_oscillating = value\n            elif value in (0, 1):\n                self._attr_oscillating = bool(value)\n            else:\n                self._attr_oscillating = None\n\n        if self.has_config(CONF_FAN_DIRECTION):\n'''
          new = '''        if self.has_config(CONF_FAN_OSCILLATING_CONTROL):\n            value = self.dps_conf(CONF_FAN_OSCILLATING_CONTROL)\n            if value == self._oscillating_on:\n                self._attr_oscillating = True\n            elif value == self._oscillating_off:\n                self._attr_oscillating = False\n            else:\n                self._attr_oscillating = None\n\n        if self.has_config(CONF_FAN_PRESET_DP):\n            raw_preset = self.dps_conf(CONF_FAN_PRESET_DP)\n            self._attr_preset_mode = self._preset_raw_to_name.get(raw_preset)\n        else:\n            self._attr_preset_mode = None\n\n        if self.has_config(CONF_FAN_DIRECTION):\n'''
          if 'self._preset_raw_to_name.get(raw_preset)' not in text:
              assert old in text
              text = text.replace(old, new, 1)

          fan.write_text(text)

          test = Path('tests/test_fan_tuya_local_semantics.py')
          test.write_text('''"""Regression tests for Tuya Local-compatible fan catalog semantics."""\n\nfrom __future__ import annotations\n\nimport unittest\nfrom unittest.mock import AsyncMock\n\nfrom homeassistant.components.fan import FanEntityFeature\n\nfrom custom_components.localtuya.const import (\n    CONF_FAN_OSCILLATING_CONTROL,\n    CONF_FAN_OSCILLATING_OFF,\n    CONF_FAN_OSCILLATING_ON,\n    CONF_FAN_PRESET_DP,\n    CONF_FAN_PRESET_VALUES,\n)\nfrom custom_components.localtuya.fan import LocaltuyaFan\n\n\nclass FanTuyaLocalSemanticsTests(unittest.IsolatedAsyncioTestCase):\n    @staticmethod\n    def _bare(config):\n        fan = object.__new__(LocaltuyaFan)\n        fan._config = config\n        fan.warning = lambda *args, **kwargs: None\n        return fan\n\n    def test_catalog_presets_preserve_exact_raw_values(self):\n        fan = self._bare({CONF_FAN_PRESET_VALUES: {\n            "normal": "Normal",\n            "fresh": "Breeze",\n        }})\n        self.assertEqual(\n            fan._configured_preset_values(),\n            {"normal": "Normal", "fresh": "Breeze"},\n        )\n\n    def test_invalid_and_duplicate_presets_are_ignored(self):\n        fan = self._bare({CONF_FAN_PRESET_VALUES: {\n            "normal": "Normal",\n            "duplicate": "Normal",\n            "": "Bad",\n        }})\n        self.assertEqual(fan._configured_preset_values(), {"normal": "Normal"})\n\n    async def test_mapped_oscillation_writes_exact_raw_value(self):\n        fan = self._bare({\n            CONF_FAN_OSCILLATING_CONTROL: 7,\n            CONF_FAN_OSCILLATING_ON: "on",\n            CONF_FAN_OSCILLATING_OFF: "off",\n        })\n        fan._oscillating_on = "on"\n        fan._oscillating_off = "off"\n        fan._device = type("Device", (), {"set_dp": AsyncMock()})()\n        fan.has_config = lambda key: key in fan._config\n\n        await fan.async_oscillate(True)\n        fan._device.set_dp.assert_awaited_once_with("on", 7)\n\n    async def test_set_preset_writes_exact_raw_value(self):\n        fan = self._bare({CONF_FAN_PRESET_DP: 2})\n        fan._preset_values = {"fresh": "Breeze"}\n        fan._device = type("Device", (), {"set_dp": AsyncMock()})()\n        fan.has_config = lambda key: key in fan._config\n\n        await fan.async_set_preset_mode("fresh")\n        fan._device.set_dp.assert_awaited_once_with("Breeze", 2)\n\n    def test_preset_feature_constant_is_available(self):\n        self.assertTrue(FanEntityFeature.PRESET_MODE)\n\n\nif __name__ == "__main__":\n    unittest.main()\n''')
          PY

          git diff --check
          python -m compileall -q custom_components/localtuya tests/test_fan_tuya_local_semantics.py

      - name: Commit runtime patch
        run: |
          set -euo pipefail
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add custom_components/localtuya/const.py custom_components/localtuya/fan.py tests/test_fan_tuya_local_semantics.py
          git commit -m 'Support Tuya Local fan presets and mapped oscillation'
          git push origin HEAD:fan-tuya-local-runtime
