name: Patch Light Brightness Step

on:
  push:
    branches: [develop]
    paths:
      - '.github/workflows/patch-light-brightness-step.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: develop
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - name: Patch runtime and tests
        run: |
          python - <<'PY'
          from pathlib import Path

          const = Path('custom_components/localtuya/const.py')
          text = const.read_text()
          old = 'CONF_BRIGHTNESS_LOWER = "brightness_lower"\nCONF_BRIGHTNESS_UPPER = "brightness_upper"\n'
          new = old + 'CONF_BRIGHTNESS_STEP = "brightness_step"\n'
          assert old in text and 'CONF_BRIGHTNESS_STEP' not in text
          const.write_text(text.replace(old, new, 1))

          light = Path('custom_components/localtuya/light.py')
          text = light.read_text()
          old = '    CONF_BRIGHTNESS_LOWER,\n    CONF_BRIGHTNESS_UPPER,\n'
          new = '    CONF_BRIGHTNESS_LOWER,\n    CONF_BRIGHTNESS_STEP,\n    CONF_BRIGHTNESS_UPPER,\n'
          assert old in text and 'CONF_BRIGHTNESS_STEP' not in text
          text = text.replace(old, new, 1)

          old = '''        vol.Optional(\n            CONF_BRIGHTNESS_UPPER,\n            default=DEFAULT_UPPER_BRIGHTNESS,\n        ): vol.All(\n            vol.Coerce(int),\n            vol.Range(min=0, max=10000),\n        ),\n'''
          new = old + '''        vol.Optional(\n            CONF_BRIGHTNESS_STEP,\n            default=1,\n        ): vol.All(\n            vol.Coerce(int),\n            vol.Range(min=1, max=10000),\n        ),\n'''
          assert old in text
          text = text.replace(old, new, 1)

          old = '''        if self._upper_brightness <= self._lower_brightness:\n            self.warning(\n                "Invalid brightness range %s..%s; using defaults",\n                self._lower_brightness,\n                self._upper_brightness,\n            )\n            self._lower_brightness = DEFAULT_LOWER_BRIGHTNESS\n            self._upper_brightness = DEFAULT_UPPER_BRIGHTNESS\n\n'''
          new = old + '''        try:\n            self._brightness_step = int(\n                self._config.get(CONF_BRIGHTNESS_STEP, 1)\n            )\n        except (TypeError, ValueError):\n            self._brightness_step = 1\n        if self._brightness_step <= 0:\n            self.warning(\n                "Invalid brightness step %s; using 1",\n                self._brightness_step,\n            )\n            self._brightness_step = 1\n\n'''
          assert old in text
          text = text.replace(old, new, 1)

          old = '''    def _ha_brightness_to_raw(self, value) -> int:\n        """Convert HA brightness to the Tuya brightness range."""\n        return map_range(\n            int(value),\n            0,\n            255,\n            self._lower_brightness,\n            self._upper_brightness,\n        )\n'''
          new = '''    def _ha_brightness_to_raw(self, value) -> int:\n        """Convert HA brightness to the Tuya brightness range."""\n        raw_value = map_range(\n            int(value),\n            0,\n            255,\n            self._lower_brightness,\n            self._upper_brightness,\n        )\n        if self._brightness_step != 1:\n            raw_value = self._brightness_step * round(\n                float(raw_value) / self._brightness_step\n            )\n        return raw_value\n'''
          assert old in text
          light.write_text(text.replace(old, new, 1))

          test = Path('tests/test_light_brightness_step.py')
          test.write_text('''"""Regression tests for Tuya brightness step mappings."""\n\nfrom __future__ import annotations\n\nimport unittest\n\nfrom custom_components.localtuya.light import LocaltuyaLight\n\n\nclass LightBrightnessStepTests(unittest.TestCase):\n    @staticmethod\n    def _light(*, lower: int, upper: int, step: int) -> LocaltuyaLight:\n        light = object.__new__(LocaltuyaLight)\n        light._lower_brightness = lower\n        light._upper_brightness = upper\n        light._brightness_step = step\n        return light\n\n    def test_step_two_matches_tuya_local_write_quantization(self):\n        light = self._light(lower=0, upper=100, step=2)\n        self.assertEqual(light._ha_brightness_to_raw(127), 50)\n        self.assertEqual(light._ha_brightness_to_raw(130), 52)\n        self.assertEqual(light._ha_brightness_to_raw(255), 100)\n\n    def test_step_ten_matches_tuya_local_write_quantization(self):\n        light = self._light(lower=10, upper=1000, step=10)\n        self.assertEqual(light._ha_brightness_to_raw(0), 10)\n        self.assertEqual(light._ha_brightness_to_raw(128), 510)\n        self.assertEqual(light._ha_brightness_to_raw(255), 1000)\n\n    def test_default_step_keeps_existing_mapping(self):\n        light = self._light(lower=10, upper=1000, step=1)\n        self.assertEqual(light._ha_brightness_to_raw(128), 507)\n\n\nif __name__ == "__main__":\n    unittest.main()\n''')
          PY
      - name: Run targeted tests
        run: |
          python -m pip install -r requirements_test.txt pytest
          python -m pytest -q tests/test_light_brightness_step.py tests/test_light_color_brightness_range.py
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add custom_components/localtuya/const.py custom_components/localtuya/light.py tests/test_light_brightness_step.py
          git diff --cached --check
          git commit -m 'Support stepped light brightness mappings'
          git push origin HEAD:develop
