name: Withdraw premature LocalTuya 6.4.0

on:
  push:
    branches:
      - withdraw-6.4.0-premature-release

permissions:
  contents: write

jobs:
  withdraw:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Delete premature GitHub release
        run: |
          set -euo pipefail
          if gh release view v6.4.0 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release delete v6.4.0 --repo "$GITHUB_REPOSITORY" --yes
          fi

      - name: Delete premature tag
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --tags "https://github.com/$GITHUB_REPOSITORY.git" refs/tags/v6.4.0 >/dev/null 2>&1; then
            git -c http.extraheader="AUTHORIZATION: bearer $GH_TOKEN" push "https://github.com/$GITHUB_REPOSITORY.git" :refs/tags/v6.4.0
          fi
