name: Apply Batch F runtime

on:
  push:
    branches:
      - develop
    paths:
      - "tools/_batch_f_runtime_patch.py"
      - ".github/workflows/batch-f-runtime-apply.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: develop
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Apply runtime patch
        run: python tools/_batch_f_runtime_patch.py
      - name: Fix optional redirect expectation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("tests/test_advanced_mapping.py")
          text = path.read_text(encoding="utf-8")
          old = 'self.assertIsNone(prune_advanced_mapping_by_dp(mappings, {17}, {16, 23}))'
          new = 'self.assertIsNotNone(prune_advanced_mapping_by_dp(mappings, {17}, {16, 23}))'
          if old not in text:
              raise SystemExit("expected Batch F regression line not found")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
      - name: Install test dependencies
        run: python -m pip install tox
      - name: Run focused tests
        run: python -m tox -e py -- tests/test_advanced_mapping.py tests/test_device_catalog.py tests/test_climate_catalog_semantics.py
      - name: Commit Batch F runtime
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add per-DP advanced mapping runtime for Batch F"
          git push origin HEAD:develop