name: Apply zero-config onboarding

on:
  push:
    branches: [develop]
    paths:
      - scripts/_zero_config_patch.py
      - .github/workflows/apply-zero-config.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
      - run: python scripts/_zero_config_patch.py
      - run: python -m compileall -q custom_components/localtuya/qr_onboarding.py custom_components/localtuya/zero_config.py
      - run: |
          git rm scripts/_zero_config_patch.py .github/workflows/apply-zero-config.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add custom_components/localtuya/qr_onboarding.py custom_components/localtuya/zero_config.py tests/test_zero_config.py tests/test_bulk_zero_config_integration.py
          git commit -m "Wire fail-closed zero-config onboarding"
          git push origin HEAD:develop
