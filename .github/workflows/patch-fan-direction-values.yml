name: Patch exact fan direction mappings

on:
  push:
    paths:
      - .github/workflows/patch-fan-direction-values.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: develop
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Apply exact direction mapping support
        run: |
          python - <<'PY'
          from pathlib import Path
          import textwrap

          # const.py
          path = Path('custom_components/localtuya/const.py')
          text = path.read_text()
          old = 'CONF_FAN_DIRECTION_REV = "fan_direction_reverse"\nCONF_FAN_DPS_TYPE = "fan_dps_type"\n'
          new = 'CONF_FAN_DIRECTION_REV = "fan_direction_reverse"\nCONF_FAN_DIRECTION_VALUES = "fan_direction_values"\nCONF_FAN_DPS_TYPE = "fan_dps_type"\n'
          assert text.count(old) == 1
          path.write_text(text.replace(old, new, 1))

          # fan_mapping.py: bounded validator shared by runtime and catalog ingress.
          path = Path('custom_components/localtuya/fan_mapping.py')
          text = path.read_text()
          marker = '\n\ndef validate_fan_speed_mapping(value):\n'
          assert text.count(marker) == 1
          addition = textwrap.dedent('''

          def validate_fan_direction_values(value):
              """Validate a bounded exact friendly -> raw string direction map."""
              if not isinstance(value, dict) or not 2 <= len(value) <= 16:
                  return None
              result = {}
              raw_seen = set()
              for raw_name, raw_value in value.items():
                  if not isinstance(raw_name, str) or not raw_name.strip():
                      return None
                  if not isinstance(raw_value, str) or not raw_value:
                      return None
                  name = raw_name.strip()
                  if name in result or raw_value in raw_seen:
                      return None
                  result[name] = raw_value
                  raw_seen.add(raw_value)
              if not {"forward", "reverse"}.issubset(result):
                  return None
              return result
          ''')
          path.write_text(text.replace(marker, addition + marker, 1))

          # fan.py
          path = Path('custom_components/localtuya/fan.py')
          text = path.read_text()
          old = '    CONF_FAN_DIRECTION_FWD,\n    CONF_FAN_DIRECTION_REV,\n    CONF_FAN_DPS_TYPE,\n'
          new = '    CONF_FAN_DIRECTION_FWD,\n    CONF_FAN_DIRECTION_REV,\n    CONF_FAN_DIRECTION_VALUES,\n    CONF_FAN_DPS_TYPE,\n'
          assert text.count(old) == 1
          text = text.replace(old, new, 1)
          old = '    fan_oscillation_to_raw,\n    fan_speed_from_raw,\n'
          new = '    fan_oscillation_to_raw,\n    validate_fan_direction_values,\n    fan_speed_from_raw,\n'
          assert text.count(old) == 1
          text = text.replace(old, new, 1)
          old = '''        self._oscillating_off = self._config.get(\n            CONF_FAN_OSCILLATING_OFF, False\n        )\n\n        speed_min = int(\n'''
          new = '''        self._oscillating_off = self._config.get(\n            CONF_FAN_OSCILLATING_OFF, False\n        )\n        self._direction_values = (\n            validate_fan_direction_values(\n                self._config.get(CONF_FAN_DIRECTION_VALUES)\n            )\n            or {}\n        )\n        self._direction_raw_to_name = {\n            raw: name for name, raw in self._direction_values.items()\n        }\n\n        speed_min = int(\n'''
          assert text.count(old) == 1
          text = text.replace(old, new, 1)
          old = '''        if direction == DIRECTION_FORWARD:\n            value = self._config.get(\n                CONF_FAN_DIRECTION_FWD,\n                DIRECTION_FORWARD,\n            )\n        elif direction == DIRECTION_REVERSE:\n            value = self._config.get(\n                CONF_FAN_DIRECTION_REV,\n                DIRECTION_REVERSE,\n            )\n        else:\n            self.warning(\n                "Unsupported fan direction %r",\n                direction,\n            )\n            return\n\n        await self._device.set_dp(\n'''
          new = '''        if self._direction_values:\n            value = self._direction_values.get(direction)\n            if value is None:\n                self.warning("Unsupported fan direction %r", direction)\n                return\n        elif direction == DIRECTION_FORWARD:\n            value = self._config.get(\n                CONF_FAN_DIRECTION_FWD,\n                DIRECTION_FORWARD,\n            )\n        elif direction == DIRECTION_REVERSE:\n            value = self._config.get(\n                CONF_FAN_DIRECTION_REV,\n                DIRECTION_REVERSE,\n            )\n        else:\n            self.warning(\n                "Unsupported fan direction %r",\n                direction,\n            )\n            return\n\n        await self._device.set_dp(\n'''
          assert text.count(old) == 1
          text = text.replace(old, new, 1)
          old = '''        if self.has_config(CONF_FAN_DIRECTION):\n            value = self.dps_conf(CONF_FAN_DIRECTION)\n\n            if value == self._config.get(\n                CONF_FAN_DIRECTION_FWD,\n                DIRECTION_FORWARD,\n            ):\n                self._attr_current_direction = DIRECTION_FORWARD\n\n            elif value == self._config.get(\n                CONF_FAN_DIRECTION_REV,\n                DIRECTION_REVERSE,\n            ):\n                self._attr_current_direction = DIRECTION_REVERSE\n\n            else:\n                self._attr_current_direction = None\n'''
          new = '''        if self.has_config(CONF_FAN_DIRECTION):\n            value = self.dps_conf(CONF_FAN_DIRECTION)\n\n            if self._direction_raw_to_name:\n                self._attr_current_direction = self._direction_raw_to_name.get(value)\n            elif value == self._config.get(\n                CONF_FAN_DIRECTION_FWD,\n                DIRECTION_FORWARD,\n            ):\n                self._attr_current_direction = DIRECTION_FORWARD\n\n            elif value == self._config.get(\n                CONF_FAN_DIRECTION_REV,\n                DIRECTION_REVERSE,\n            ):\n                self._attr_current_direction = DIRECTION_REVERSE\n\n            else:\n                self._attr_current_direction = None\n'''
          assert text.count(old) == 1
          path.write_text(text.replace(old, new, 1))

          # device_catalog.py
          path = Path('custom_components/localtuya/device_catalog.py')
          text = path.read_text()
          old = '    CONF_EXTRA_STATE_ATTRIBUTES_DPS,\n'
          new = '    CONF_EXTRA_STATE_ATTRIBUTES_DPS,\n    CONF_FAN_DIRECTION_VALUES,\n'
          assert text.count(old) == 1
          text = text.replace(old, new, 1)
          old = '''            "fan_speed_mapping", "fan_oscillating_mapping", "fan_preset_raw_type",\n            "fan_preset_default", "fan_no_switch",\n'''
          new = '''            "fan_speed_mapping", "fan_oscillating_mapping", "fan_preset_raw_type",\n            "fan_preset_default", "fan_no_switch", CONF_FAN_DIRECTION_VALUES,\n'''
          assert text.count(old) == 1
          text = text.replace(old, new, 1)
          old = '''            validate_fan_oscillation_mapping,\n            validate_fan_speed_mapping,\n        )\n'''
          new = '''            validate_fan_direction_values,\n            validate_fan_oscillation_mapping,\n            validate_fan_speed_mapping,\n        )\n'''
          assert text.count(old) == 1
          text = text.replace(old, new, 1)
          anchor = '''        if "fan_preset_default" in config:\n            default = config["fan_preset_default"]\n            values = config.get("fan_preset_values")\n            if not isinstance(default, str) or not isinstance(values, dict) or default not in values:\n                return None\n'''
          assert text.count(anchor) == 1
          addition = anchor + '''        if CONF_FAN_DIRECTION_VALUES in config:\n            values = validate_fan_direction_values(config[CONF_FAN_DIRECTION_VALUES])\n            if values is None or "fan_direction" not in config:\n                return None\n            config[CONF_FAN_DIRECTION_VALUES] = values\n'''
          text = text.replace(anchor, addition, 1)
          path.write_text(text)

          # focused runtime/catalog tests
          path = Path('tests/test_fan_direction_values.py')
          path.write_text(textwrap.dedent('''
          """Exact catalog-provided fan direction mappings."""

          import unittest

          from custom_components.localtuya.device_catalog import _validate_entity
          from custom_components.localtuya.fan import LocaltuyaFan
          from custom_components.localtuya.fan_mapping import validate_fan_direction_values


          class DummyDevice:
              def __init__(self):
                  self.write = None

              async def set_dp(self, value, dp):
                  self.write = (value, dp)


          class FanDirectionValuesTests(unittest.IsolatedAsyncioTestCase):
              def test_validator_preserves_exact_three_way_mapping(self):
                  values = {"forward": "in", "reverse": "out", "exchange": "exch"}
                  self.assertEqual(validate_fan_direction_values(values), values)
                  self.assertIsNone(validate_fan_direction_values({"forward": "in", "exchange": "exch"}))
                  self.assertIsNone(validate_fan_direction_values({"forward": "in", "reverse": "in"}))

              def test_catalog_accepts_only_bounded_exact_direction_values(self):
                  entity = {"platform": "fan", "config": {
                      "platform": "fan", "id": 1, "fan_direction": 2,
                      "fan_direction_values": {
                          "forward": "in", "reverse": "out", "exchange": "exch",
                      },
                  }}
                  validated = _validate_entity(entity)
                  self.assertIsNotNone(validated)
                  self.assertEqual(validated["config"]["fan_direction_values"]["exchange"], "exch")
                  bad = {"platform": "fan", "config": {
                      "platform": "fan", "id": 1, "fan_direction": 2,
                      "fan_direction_values": {"forward": "in", "reverse": "in"},
                  }}
                  self.assertIsNone(_validate_entity(bad))

              async def test_exchange_write_uses_exact_raw_value(self):
                  obj = object.__new__(LocaltuyaFan)
                  obj._config = {"fan_direction": 2}
                  obj._direction_values = {
                      "forward": "in", "reverse": "out", "exchange": "exch",
                  }
                  obj._device = DummyDevice()
                  obj.has_config = lambda key: key == "fan_direction"
                  await obj.async_set_direction("exchange")
                  self.assertEqual(obj._device.write, ("exch", 2))
          '''))
          PY
      - name: Syntax check
        run: python -m py_compile custom_components/localtuya/const.py custom_components/localtuya/fan_mapping.py custom_components/localtuya/fan.py custom_components/localtuya/device_catalog.py tests/test_fan_direction_values.py
      - name: Install tox
        run: python -m pip install "tox>=4.20,<5"
      - name: Run full suite
        run: python -m tox -e py314
      - name: Commit runtime support
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add custom_components/localtuya/const.py custom_components/localtuya/fan_mapping.py custom_components/localtuya/fan.py custom_components/localtuya/device_catalog.py tests/test_fan_direction_values.py
          git diff --cached --check
          git commit -m "Support exact fan direction mappings"
          git push origin HEAD:develop
