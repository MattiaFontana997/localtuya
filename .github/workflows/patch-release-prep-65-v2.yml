name: Patch 6.5.0 release preparation v2

on:
  push:
    branches:
      - release-prep/6.5.0
    paths:
      - .github/workflows/patch-release-prep-65-v2.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: release-prep/6.5.0

      - name: Apply release preparation fixes
        shell: bash
        run: |
          sed -n "/python - <<'PY'/,/^          PY$/p" .github/workflows/patch-release-prep-65.yml \
            | tail -n +2 | head -n -1 | sed 's/^          //' > /tmp/release_patch.py
          python /tmp/release_patch.py

      - name: Validate dependency-free checks
        run: |
          python -m compileall custom_components/localtuya tools tests
          git diff --check
          python tests/test_catalog_snapshot_tool.py
          python tools/sync_builtin_catalog.py --check

      - name: Commit release preparation fixes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/sync_builtin_catalog.py custom_components/localtuya/config_flow.py custom_components/localtuya/strings.json custom_components/localtuya/translations tests/test_config_flow_mapper.py tests/test_mapping_translations.py tests/test_catalog_snapshot_tool.py
          if git diff --cached --quiet; then
            echo "Nothing to commit"
            exit 0
          fi
          git commit -m "Finish 6.5.0 catalog and contribution UX preparation"
          git push origin HEAD:release-prep/6.5.0
