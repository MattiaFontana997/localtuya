name: Publish LocalTuya 6.6.1b1 prerelease

on:
  push:
    branches:
      - "fix/6.6.0-gateway-lan-onboarding"
    paths:
      - ".github/workflows/publish-661b1.yml"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/6.6.0-gateway-lan-onboarding
          fetch-depth: 0

      - name: Prepare prerelease version
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("custom_components/localtuya/manifest.json")
          data = json.loads(path.read_text(encoding="utf-8"))
          data["version"] = "6.6.1b1"
          path.write_text(json.dumps(data, indent=2) + "\n", encoding="utf-8")
          PY

      - name: Syntax validation
        run: |
          python -m compileall -q \
            custom_components/localtuya/pytuya \
            custom_components/localtuya/config_flow.py \
            custom_components/localtuya/qr_onboarding.py \
            tests/test_gateway_subdevice_support.py \
            tests/test_qr_gateway_onboarding.py

      - name: Commit clean prerelease state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/publish-661b1.yml
          git add custom_components/localtuya/manifest.json
          git commit -m "Prepare LocalTuya 6.6.1b1 prerelease"
          git push origin HEAD:fix/6.6.0-gateway-lan-onboarding

      - name: Create prerelease tag
        run: |
          git tag -a v6.6.1b1 -m "LocalTuya 6.6.1b1"
          git push origin v6.6.1b1

      - name: Publish GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > /tmp/release-notes.md <<'EOF'
          LocalTuya 6.6.1b1 is a targeted beta based on 6.6.0 for real-install testing of gateway/sub-device onboarding and Tuya LAN probing fixes.

          Highlights:
          - QR onboarding now keeps Tuya gateway child devices eligible when the child has no own local key but the parent gateway provides the local transport credentials.
          - Bluetooth/Zigbee child devices retain their own device identity while connecting through the parent gateway IP/local key using node_id/cid and gateway_id routing.
          - Runtime connections pass child routing metadata to pytuya, so child devices continue to operate through the gateway after onboarding and Home Assistant restarts.
          - Corrected gateway child payload generation for legacy Tuya LAN protocols and for 3.4/3.5 control/query traffic.
          - Added protocol 3.5 DP_QUERY compatibility fallback for devices that accept TCP/session-key negotiation but reject the normal empty query with `data unvalid`.
          - LAN validation no longer treats that known 3.5 query-shape incompatibility as a generic unreachable-host failure.
          - Added regression coverage for gateway child routing, child payloads, gateway transport credentials and the 3.5 query fallback.

          This beta is specifically intended to test the reported cases where a Bluetooth gateway with child lamps was missing from usable onboarding and where a directly reachable thermostat was incorrectly reported as unreachable.

          Back up Home Assistant before installing a prerelease. Do not promote this build to stable until the real gateway/lamp and thermostat tests pass.
          EOF

          gh release create v6.6.1b1 \
            --verify-tag \
            --prerelease \
            --title "LocalTuya 6.6.1b1 — Gateway & LAN Onboarding Fixes" \
            --notes-file /tmp/release-notes.md
