name: Fix repair translation schema

on:
  push:
    branches:
      - develop
    paths:
      - .github/workflows/fix-repair-translation-schema.yml

permissions:
  contents: write

jobs:
  fix-translations:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: develop

      - name: Remove invalid fixable issue descriptions
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path("custom_components/localtuya/translations")
          for path in sorted(root.glob("*.json")):
              data = json.loads(path.read_text(encoding="utf-8"))
              issue = data.get("issues", {}).get("host_recovery_failed")
              if isinstance(issue, dict):
                  issue.pop("description", None)
              path.write_text(
                  json.dumps(data, ensure_ascii=False, indent=4) + "\n",
                  encoding="utf-8",
              )
          PY

      - name: Commit translations
        shell: bash
        run: |
          if git diff --quiet -- custom_components/localtuya/translations; then
            echo "No translation changes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add custom_components/localtuya/translations
          git commit -m "Fix Home Assistant repair translation schema"
          git push origin HEAD:develop
