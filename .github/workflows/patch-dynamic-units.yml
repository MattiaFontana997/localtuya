name: Patch dynamic sensor and number units

on:
  push:
    paths:
      - .github/workflows/patch-dynamic-units.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: develop
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Apply runtime patch
        run: |
          python - <<'PY'
          from pathlib import Path

          const = Path('custom_components/localtuya/const.py')
          text = const.read_text()
          anchor = 'CONF_SENSOR_UNIX_TIMESTAMP = "sensor_unix_timestamp"\n'
          assert text.count(anchor) == 1
          text = text.replace(anchor, anchor + 'CONF_DYNAMIC_UNIT_DP = "dynamic_unit_dp"\n', 1)
          const.write_text(text)

          common = Path('custom_components/localtuya/common.py')
          text = common.read_text()
          old = '''from homeassistant.const import (\n    CONF_DEVICE_ID, CONF_DEVICES, CONF_ENTITIES, CONF_FRIENDLY_NAME, CONF_HOST,\n    CONF_ID, CONF_PLATFORM, CONF_SCAN_INTERVAL, STATE_UNKNOWN,\n)'''
          new = '''from homeassistant.const import (\n    CONF_DEVICE_ID, CONF_DEVICES, CONF_ENTITIES, CONF_FRIENDLY_NAME, CONF_HOST,\n    CONF_ID, CONF_PLATFORM, CONF_SCAN_INTERVAL, STATE_UNKNOWN,\n    UnitOfArea, UnitOfDensity, UnitOfTemperature,\n)'''
          assert text.count(old) == 1
          text = text.replace(old, new, 1)
          marker = '_LOGGER = logging.getLogger(__name__)\n'
          assert text.count(marker) == 1
          helper = '''_LOGGER = logging.getLogger(__name__)\n\n_TUYA_ASCII_UNIT_MAP = {\n    "C": UnitOfTemperature.CELSIUS,\n    "F": UnitOfTemperature.FAHRENHEIT,\n    "ugm3": UnitOfDensity.MICROGRAMS_PER_CUBIC_METER,\n    "m2": UnitOfArea.SQUARE_METERS,\n}\n\n\ndef tuya_unit_from_ascii(unit):\n    """Translate the exact ASCII unit aliases used by pinned Tuya Local."""\n    return _TUYA_ASCII_UNIT_MAP.get(unit, unit)\n'''
          text = text.replace(marker, helper, 1)
          common.write_text(text)

          sensor = Path('custom_components/localtuya/sensor.py')
          text = sensor.read_text()
          text = text.replace(
              'from .common import LocalTuyaEntity, async_setup_entry\n',
              'from .common import LocalTuyaEntity, async_setup_entry, tuya_unit_from_ascii\n',
              1,
          )
          text = text.replace(
              'from .const import CONF_SCALING, CONF_SENSOR_UNIX_TIMESTAMP\n',
              'from .const import CONF_DYNAMIC_UNIT_DP, CONF_SCALING, CONF_SENSOR_UNIX_TIMESTAMP\n',
              1,
          )
          anchor = '        vol.Optional(CONF_UNIT_OF_MEASUREMENT): str,\n'
          assert text.count(anchor) == 1
          text = text.replace(anchor, anchor + '        vol.Optional(CONF_DYNAMIC_UNIT_DP): vol.In(dps),\n', 1)
          marker = '    @property\n    def native_value(self):\n'
          assert text.count(marker) == 1
          prop = '''    @property\n    def native_unit_of_measurement(self):\n        """Return a catalog-provided live unit when configured."""\n        dp_id = self._config.get(CONF_DYNAMIC_UNIT_DP)\n        if dp_id is not None:\n            return tuya_unit_from_ascii(self.dps(dp_id))\n        return self._attr_native_unit_of_measurement\n\n'''
          text = text.replace(marker, prop + marker, 1)
          sensor.write_text(text)

          number = Path('custom_components/localtuya/number.py')
          text = number.read_text()
          text = text.replace(
              'from .common import LocalTuyaEntity, async_setup_entry\n',
              'from .common import LocalTuyaEntity, async_setup_entry, tuya_unit_from_ascii\n',
              1,
          )
          anchor = '    CONF_RESTORE_ON_RECONNECT, CONF_SCALING, CONF_STEPSIZE_VALUE, CONF_NUMBER_MODE,\n'
          assert text.count(anchor) == 1
          text = text.replace(anchor, '    CONF_RESTORE_ON_RECONNECT, CONF_SCALING, CONF_STEPSIZE_VALUE, CONF_NUMBER_MODE,\n    CONF_DYNAMIC_UNIT_DP,\n', 1)
          anchor = '        vol.Optional(CONF_UNIT_OF_MEASUREMENT): str,\n'
          assert text.count(anchor) == 1
          text = text.replace(anchor, anchor + '        vol.Optional(CONF_DYNAMIC_UNIT_DP): vol.In(dps),\n', 1)
          marker = '    @property\n    def native_value(self) -> float | None:\n'
          assert text.count(marker) == 1
          prop = '''    @property\n    def native_unit_of_measurement(self):\n        """Return a catalog-provided live unit when configured."""\n        dp_id = self._config.get(CONF_DYNAMIC_UNIT_DP)\n        if dp_id is not None:\n            return tuya_unit_from_ascii(self.dps(dp_id))\n        return self._attr_native_unit_of_measurement\n\n'''
          text = text.replace(marker, prop + marker, 1)
          number.write_text(text)

          test = Path('tests/test_dynamic_units.py')
          test.write_text('''"""Regression tests for dynamic Sensor/Number units."""\n\nimport unittest\nfrom homeassistant.const import UnitOfTemperature\nfrom custom_components.localtuya.const import CONF_DYNAMIC_UNIT_DP\nfrom custom_components.localtuya.sensor import LocaltuyaSensor\nfrom custom_components.localtuya.number import LocaltuyaNumber\nfrom custom_components.localtuya.common import tuya_unit_from_ascii\n\n\ndef _entity(cls, raw_unit):\n    entity = object.__new__(cls)\n    entity._config = {CONF_DYNAMIC_UNIT_DP: 13}\n    entity._attr_native_unit_of_measurement = None\n    entity.dps = lambda dp: raw_unit if dp == 13 else None\n    return entity\n\n\nclass DynamicUnitTests(unittest.TestCase):\n    def test_ascii_unit_aliases_match_tuya_local(self):\n        self.assertEqual(tuya_unit_from_ascii("C"), UnitOfTemperature.CELSIUS)\n        self.assertEqual(tuya_unit_from_ascii("F"), UnitOfTemperature.FAHRENHEIT)\n        self.assertEqual(tuya_unit_from_ascii("ppm"), "ppm")\n\n    def test_sensor_uses_live_unit_dp(self):\n        sensor = _entity(LocaltuyaSensor, "F")\n        self.assertEqual(sensor.native_unit_of_measurement, UnitOfTemperature.FAHRENHEIT)\n\n    def test_number_uses_live_unit_dp(self):\n        number = _entity(LocaltuyaNumber, "C")\n        self.assertEqual(number.native_unit_of_measurement, UnitOfTemperature.CELSIUS)\n\n    def test_static_unit_remains_when_no_dynamic_dp(self):\n        sensor = object.__new__(LocaltuyaSensor)\n        sensor._config = {}\n        sensor._attr_native_unit_of_measurement = "%"\n        self.assertEqual(sensor.native_unit_of_measurement, "%")\n''')
          PY
      - name: Install dependencies
        run: |
          python -m pip install -r requirements_test.txt
          python -m pip install pytest
      - name: Run regressions
        run: python -m pytest -q tests/test_dynamic_units.py tests/test_catalog_platforms_core.py
      - name: Commit runtime support
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add custom_components/localtuya/const.py custom_components/localtuya/common.py custom_components/localtuya/sensor.py custom_components/localtuya/number.py tests/test_dynamic_units.py
          git diff --cached --check
          git commit -m "Support dynamic sensor and number units"
          git push origin HEAD:develop
