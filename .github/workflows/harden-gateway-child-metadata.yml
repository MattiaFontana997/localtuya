name: Harden gateway child metadata

on:
  push:
    branches:
      - develop
    paths:
      - .github/workflows/harden-gateway-child-metadata.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop

      - name: Preserve and derive safe child routing metadata
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("custom_components/localtuya/qr_onboarding.py")
          text = path.read_text(encoding="utf-8")

          old = '''            ).strip()
              device_ip = str(getattr(device, "ip", "") or "").strip()
          '''
          new = '''            ).strip()
              is_subdevice = bool(getattr(device, "sub", False))
              device_uuid = str(getattr(device, "uuid", "") or "").strip()
              if not node_id and is_subdevice and gateway_id and device_uuid:
                  # Some Tuya child records omit node_id. Use UUID as CID only
                  # for an explicitly marked subdevice with a known gateway.
                  node_id = device_uuid
              device_ip = str(getattr(device, "ip", "") or "").strip()
          '''
          if text.count(old) != 1:
              raise SystemExit("QR gateway metadata insertion point is ambiguous")
          text = text.replace(old, new, 1)

          old = '''    if protocol not in {"auto", "3.1", "3.2", "3.3", "3.4", "3.5"}:
              protocol = "auto"
              result: dict[str, Any] = {
          '''
          new = '''    if protocol not in {"auto", "3.1", "3.2", "3.3", "3.4", "3.5"}:
              protocol = "auto"
              gateway_id = str(
                  raw.get("gateway_id")
                  or raw.get("gatewayId")
                  or raw.get("parent_id")
                  or ""
              ).strip()
              node_id = str(
                  raw.get("node_id")
                  or raw.get("cid")
                  or raw.get("device_cid")
                  or ""
              ).strip()
              if not node_id and bool(raw.get("sub", False)) and gateway_id:
                  node_id = str(raw.get("uuid") or "").strip()
              result: dict[str, Any] = {
          '''
          if text.count(old) != 1:
              raise SystemExit("import routing insertion point is ambiguous")
          text = text.replace(old, new, 1)

          old = '''        CONF_ENABLE_DEBUG: bool(raw.get(CONF_ENABLE_DEBUG, False)),
              }
              product_key = (
          '''
          new = '''        CONF_ENABLE_DEBUG: bool(raw.get(CONF_ENABLE_DEBUG, False)),
              }
              if node_id:
                  result["node_id"] = node_id
              if gateway_id:
                  result["gateway_id"] = gateway_id
              product_key = (
          '''
          if text.count(old) != 1:
              raise SystemExit("import result insertion point is ambiguous")
          text = text.replace(old, new, 1)

          path.write_text(text, encoding="utf-8")
          PY

      - name: Validate and push
        shell: bash
        run: |
          python -m compileall -q custom_components/localtuya/qr_onboarding.py
          git rm .github/workflows/harden-gateway-child-metadata.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add custom_components/localtuya/qr_onboarding.py
          git commit -m "Harden gateway child routing metadata"
          git push origin HEAD:develop
