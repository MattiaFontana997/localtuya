name: Apply Batch N Climate Range Runtime

on:
  push:
    branches: [develop]
    paths:
      - '_apply_batch_n_climate_range_cleanup.py'
      - '.github/workflows/apply-batch-n-climate-range-runtime.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: develop
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: requirements_test.txt
      - name: Apply cleanup
        run: python _apply_batch_n_climate_range_cleanup.py
      - name: Install tox
        run: python -m pip install 'tox>=4.20,<5'
      - name: Run full test suite
        run: python -m tox -e py314
      - name: Commit runtime cleanup
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add custom_components/localtuya/climate.py tests/test_climate_advanced_metadata.py
          if git diff --cached --quiet; then
            echo 'Runtime cleanup already current'
            exit 0
          fi
          git commit -m 'Deduplicate climate temperature limit properties'
          git push origin HEAD:develop
