name: Validate and publish 6.7.0b2

on:
  push:
    branches: [release/6.7.0b2]

permissions:
  contents: read

concurrency:
  group: prerelease-6.7.0b2
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: requirements_test.txt
      - run: python -m pip install -r requirements_test.txt
      - run: python -m unittest discover -s tests -p 'test_*.py' -q
      - name: HACS validation
        uses: hacs/action@1ebf01c408f29afcb6406bd431bc98fd8cbb15aa
        with:
          category: integration
      - name: Hassfest validation
        uses: home-assistant/actions/hassfest@58bff37c8947f690ace498be413a9b78d6f30f93

  publish:
    needs: validate
    if: github.repository == 'MattiaFontana997/localtuya' && github.ref == 'refs/heads/release/6.7.0b2'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Verify version and build archive
        run: |
          python -c 'import json; assert json.load(open("custom_components/localtuya/manifest.json"))["version"] == "6.7.0b2"'
          git archive --format=zip --output=localtuya-6.7.0b2.zip HEAD custom_components/localtuya
      - name: Publish beta release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v6.7.0b2 >/dev/null 2>&1; then
            current_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v6.7.0b2" --jq .object.sha)"
            # Only finish this session's beta, never replace an unrelated tag.
            if [ "$current_sha" != "$GITHUB_SHA" ] && [ "$current_sha" != "847e099fe1e64b39e1a2ecace565b3c75ec5dd78" ]; then
              echo "Unexpected beta tag target; refusing to replace it."
              exit 1
            fi
            gh release edit v6.7.0b2 --draft=true
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/v6.7.0b2" -f sha="$GITHUB_SHA" -F force=false
            gh release upload v6.7.0b2 localtuya-6.7.0b2.zip --clobber
            gh release edit v6.7.0b2 --draft=false --prerelease --latest=false --target "$GITHUB_SHA" --notes-file docs/releases/6.7.0b2.md
          else
            gh release create v6.7.0b2 localtuya-6.7.0b2.zip --target "$GITHUB_SHA" --title "LocalTuya 6.7.0b2" --prerelease --latest=false --notes-file docs/releases/6.7.0b2.md
          fi
