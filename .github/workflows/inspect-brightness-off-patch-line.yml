name: Inspect brightness off patch line

on:
  push:
    paths:
      - .github/workflows/inspect-brightness-off-patch-line.yml

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: develop
      - name: Show extracted patch around failure
        run: |
          python - <<'PY'
          from pathlib import Path
          lines = Path('.github/workflows/run-brightness-power-off-value-v2.yml').read_text().splitlines()
          start = next(i for i, line in enumerate(lines) if line.strip() == "python - <<'PY'")
          end = next(i for i in range(start + 1, len(lines)) if lines[i].strip() == 'PY')
          body = '\n'.join(line[10:] if line.startswith('          ') else line for line in lines[start + 1:end])
          for number, line in enumerate(body.splitlines(), 1):
              if 118 <= number <= 134:
                  print(f'{number:04d}: {line}')
          PY
