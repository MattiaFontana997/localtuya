name: Patch advanced bitfield conditions

on:
  push:
    paths:
      - .github/workflows/patch-advanced-bitfield-conditions.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: develop
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Apply runtime patch
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('custom_components/localtuya/advanced_mapping.py')
          text = path.read_text()

          old = '''_CONDITION_KEYS = {"dps_val", "value", "scale", "invert", "step", "range", "target_range", "value_redirect_dp", "hidden", "invalid"}\n'''
          new = '''_CONDITION_KEYS = {"dps_val", "value", "scale", "invert", "step", "range", "target_range", "value_redirect_dp", "hidden", "invalid", "bitmask"}\n'''
          assert text.count(old) == 1
          text = text.replace(old, new, 1)

          old = '''def _active_condition(rule: dict[str, Any], status: dict[str, Any]) -> dict[str, Any] | None:\n    constraint_dp = rule.get("constraint_dp")\n    if constraint_dp is None:\n        return None\n    current = status.get(str(constraint_dp))\n    for condition in rule.get("conditions", []):\n        if _matches(condition.get("dps_val"), current):\n            return condition\n    return None\n\n\ndef _rule_matches_raw(rule: dict[str, Any], actual: Any) -> bool:\n'''
          new = '''def _condition_matches_raw(condition: dict[str, Any], actual: Any) -> bool:\n    """Match one condition, including Tuya Local constraint-bitfield semantics."""\n    expected = condition.get("dps_val")\n    if condition.get("bitmask", False):\n        # Tuya Local first accepts exact equality (including 0), then for a\n        # bitfield constraint requires every requested bit to be present.\n        if _matches(expected, actual):\n            return True\n        try:\n            return (int(actual) & int(expected)) == int(expected)\n        except (TypeError, ValueError):\n            return False\n    return _matches(expected, actual)\n\n\ndef _active_condition(rule: dict[str, Any], status: dict[str, Any]) -> dict[str, Any] | None:\n    constraint_dp = rule.get("constraint_dp")\n    if constraint_dp is None:\n        return None\n    current = status.get(str(constraint_dp))\n    active = None\n    for condition in rule.get("conditions", []):\n        if _condition_matches_raw(condition, current):\n            # Tuya Local keeps scanning and the last matching condition wins.\n            active = condition\n    return active\n\n\ndef _rule_matches_raw(rule: dict[str, Any], actual: Any) -> bool:\n'''
          assert text.count(old) == 1
          text = text.replace(old, new, 1)
          path.write_text(text)

          test = Path('tests/test_advanced_mapping.py')
          body = test.read_text()
          marker = '''    def test_bitmask_mapping_rejects_non_integer_or_negative_masks(self):\n'''
          assert body.count(marker) == 1
          addition = '''    def test_bitfield_constraint_condition_requires_full_mask_containment(self):\n        rules = validate_advanced_mapping([\n            {\n                "dps_val": 0,\n                "value": True,\n                "bitmask": True,\n                "constraint_dp": 115,\n                "conditions": [\n                    {"dps_val": 0, "value": False, "bitmask": True},\n                    {"dps_val": 4, "value": False, "bitmask": True},\n                ],\n            },\n            {"value": True},\n        ])\n        self.assertIsNotNone(rules)\n        self.assertEqual(map_value_from_dps(0, rules, {"115": 0})[0], False)\n        self.assertEqual(map_value_from_dps(0, rules, {"115": 4})[0], False)\n        self.assertEqual(map_value_from_dps(0, rules, {"115": 5})[0], False)\n        self.assertEqual(map_value_from_dps(0, rules, {"115": 2})[0], True)\n\n    def test_bitfield_condition_last_match_wins_like_tuya_local(self):\n        rules = validate_advanced_mapping([\n            {\n                "dps_val": 1,\n                "value": "base",\n                "constraint_dp": 2,\n                "conditions": [\n                    {"dps_val": 1, "value": "bit1", "bitmask": True},\n                    {"dps_val": 3, "value": "bits13", "bitmask": True},\n                ],\n            }\n        ])\n        self.assertIsNotNone(rules)\n        self.assertEqual(map_value_from_dps(1, rules, {"2": 3})[0], "bits13")\n        self.assertEqual(map_value_from_dps(1, rules, {"2": 7})[0], "bits13")\n\n    def test_bitmask_condition_rejects_non_integer_or_negative_masks(self):\n        self.assertIsNone(validate_advanced_mapping([{\n            "constraint_dp": 2,\n            "conditions": [{"dps_val": "4", "bitmask": True}],\n        }]))\n        self.assertIsNone(validate_advanced_mapping([{\n            "constraint_dp": 2,\n            "conditions": [{"dps_val": -4, "bitmask": True}],\n        }]))\n\n'''
          body = body.replace(marker, addition + marker, 1)
          test.write_text(body)
          PY
      - name: Install dependencies
        run: python -m pip install -r requirements_test.txt
      - name: Run advanced mapping regressions
        run: python -m pytest -q tests/test_advanced_mapping.py tests/test_advanced_mapping_v2.py
      - name: Run full tests
        run: python -m pytest -q
      - name: Commit runtime support
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add custom_components/localtuya/advanced_mapping.py tests/test_advanced_mapping.py
          git diff --cached --check
          git commit -m "Support bitfield advanced mapping conditions"
          git push origin HEAD:develop
