name: Fix synthetic light config regression

on:
  push:
    paths:
      - .github/workflows/fix-light-synthetic-config.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: develop
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Patch synthetic-object compatibility
        run: |
          python - <<'PY'
          import re
          from pathlib import Path

          path = Path('custom_components/localtuya/light.py')
          text = path.read_text()

          old = '        configured = self._config.get(CONF_COLOR_SATURATION_UPPER)\n'
          new = '        config = getattr(self, "_config", {})\n        configured = config.get(CONF_COLOR_SATURATION_UPPER) if isinstance(config, dict) else None\n'
          if text.count(old) != 1:
              raise SystemExit(f'expected one saturation config access, found {text.count(old)}')
          text = text.replace(old, new)

          anchor = '        return 255 if extended else 1000\n\n    def _raw_brightness_to_ha(self, value) -> int | None:\n'
          helper = (
              '        return 255 if extended else 1000\n\n'
              '    def _color_brightness_range_configured(self) -> bool:\n'
              '        """Return whether an explicit HSV brightness range is configured."""\n'
              '        config = getattr(self, "_config", {})\n'
              '        return isinstance(config, dict) and (\n'
              '            CONF_COLOR_BRIGHTNESS_LOWER in config\n'
              '            or CONF_COLOR_BRIGHTNESS_UPPER in config\n'
              '        )\n\n'
              '    def _raw_brightness_to_ha(self, value) -> int | None:\n'
          )
          if text.count(anchor) != 1:
              raise SystemExit(f'expected one brightness helper anchor, found {text.count(anchor)}')
          text = text.replace(anchor, helper)

          pattern = re.compile(
              r'(?P<indent>\s*)if \(\n'
              r'(?P=indent)    CONF_COLOR_BRIGHTNESS_LOWER in self\._config\n'
              r'(?P=indent)    or CONF_COLOR_BRIGHTNESS_UPPER in self\._config\n'
              r'(?P=indent)\):'
          )
          text, replaced = pattern.subn(
              lambda m: f'{m.group("indent")}if self._color_brightness_range_configured():',
              text,
          )
          if replaced != 2:
              raise SystemExit(f'expected two direct color range checks, found {replaced}')

          path.write_text(text)
          PY
      - name: Install tox
        run: python -m pip install "tox>=4.20,<5"
      - name: Run full test suite
        run: python -m tox -e py314
      - name: Commit fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add custom_components/localtuya/light.py
          git diff --cached --check
          git commit -m "Keep synthetic light color helpers backward compatible"
          git push origin HEAD:develop
