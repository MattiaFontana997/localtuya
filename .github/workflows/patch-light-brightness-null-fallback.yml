name: Patch Light Brightness Null Fallback

on:
  push:
    branches: [develop]
    paths:
      - '.github/workflows/patch-light-brightness-null-fallback.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: develop
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - name: Patch runtime and tests
        run: |
          python - <<'PY'
          from pathlib import Path

          const = Path('custom_components/localtuya/const.py')
          text = const.read_text()
          old = 'CONF_BRIGHTNESS_STEP = "brightness_step"\n'
          new = old + 'CONF_BRIGHTNESS_NULL_VALUE = "brightness_null_value"\n'
          assert old in text and 'CONF_BRIGHTNESS_NULL_VALUE' not in text
          const.write_text(text.replace(old, new, 1))

          light = Path('custom_components/localtuya/light.py')
          text = light.read_text()
          old = '    CONF_BRIGHTNESS_LOWER,\n    CONF_BRIGHTNESS_STEP,\n'
          new = '    CONF_BRIGHTNESS_LOWER,\n    CONF_BRIGHTNESS_NULL_VALUE,\n    CONF_BRIGHTNESS_STEP,\n'
          assert old in text and 'CONF_BRIGHTNESS_NULL_VALUE' not in text
          text = text.replace(old, new, 1)

          old = '''        vol.Optional(\n            CONF_BRIGHTNESS_STEP,\n            default=1,\n        ): vol.All(\n            vol.Coerce(int),\n            vol.Range(min=1, max=10000),\n        ),\n'''
          new = old + '''        vol.Optional(CONF_BRIGHTNESS_NULL_VALUE): vol.All(\n            vol.Coerce(int),\n            vol.Range(min=0, max=10000),\n        ),\n'''
          assert old in text
          text = text.replace(old, new, 1)

          old = '''    def _raw_brightness_to_ha(self, value) -> int | None:\n        """Convert a Tuya brightness value to HA's 0..255 range."""\n        if value is None or isinstance(value, bool):\n            return None\n\n        try:\n            value = float(value)\n'''
          new = '''    def _raw_brightness_to_ha(self, value) -> int | None:\n        """Convert a Tuya brightness value to HA's 0..255 range."""\n        if value is None:\n            config = getattr(self, "_config", {})\n            if isinstance(config, dict):\n                value = config.get(CONF_BRIGHTNESS_NULL_VALUE)\n            if value is None:\n                return None\n\n        if isinstance(value, bool):\n            return None\n\n        try:\n            value = float(value)\n'''
          assert old in text
          light.write_text(text.replace(old, new, 1))

          test = Path('tests/test_light_brightness_null_fallback.py')
          test.write_text('''"""Regression tests for Tuya null brightness read fallbacks."""\n\nfrom __future__ import annotations\n\nimport unittest\n\nfrom custom_components.localtuya.light import LocaltuyaLight\n\n\nclass LightBrightnessNullFallbackTests(unittest.TestCase):\n    @staticmethod\n    def _light(config=None) -> LocaltuyaLight:\n        light = object.__new__(LocaltuyaLight)\n        light._lower_brightness = 0\n        light._upper_brightness = 1000\n        if config is not None:\n            light._config = config\n        return light\n\n    def test_null_without_fallback_remains_unknown(self):\n        self.assertIsNone(self._light({})._raw_brightness_to_ha(None))\n\n    def test_null_fallback_is_applied_on_read_only(self):\n        light = self._light({"brightness_null_value": 0})\n        self.assertEqual(light._raw_brightness_to_ha(None), 0)\n        self.assertEqual(light._raw_brightness_to_ha(500), 128)\n\n    def test_legacy_synthetic_light_without_config_remains_safe(self):\n        self.assertIsNone(self._light()._raw_brightness_to_ha(None))\n\n\nif __name__ == "__main__":\n    unittest.main()\n''')
          PY
      - name: Run targeted tests
        run: |
          python -m pip install -r requirements_test.txt pytest
          python -m pytest -q tests/test_light_brightness_null_fallback.py tests/test_light_brightness_step.py tests/test_light_color_brightness_range.py
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add custom_components/localtuya/const.py custom_components/localtuya/light.py tests/test_light_brightness_null_fallback.py
          git diff --cached --check
          git commit -m 'Support null light brightness read fallback'
          git push origin HEAD:develop
