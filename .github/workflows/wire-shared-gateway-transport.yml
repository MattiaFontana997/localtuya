name: Wire shared gateway transport

on:
  push:
    branches:
      - develop
    paths:
      - .github/workflows/wire-shared-gateway-transport.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
      - run: python .github/scripts/wire_shared_gateway.py
      - run: python -m compileall -q custom_components/localtuya/common.py custom_components/localtuya/gateway_transport.py
      - run: git diff --check
      - run: |
          git rm .github/workflows/wire-shared-gateway-transport.yml .github/scripts/wire_shared_gateway.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add custom_components/localtuya/common.py
          git commit -m "Share one LAN transport across gateway child devices"
          git push origin HEAD:develop
