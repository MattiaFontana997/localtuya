name: Wire shared gateway transport

on:
  push:
    branches: [develop]
    paths: [.github/workflows/wire-shared-gateway-transport.yml]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
      - name: Patch common runtime
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('custom_components/localtuya/common.py')
          s = p.read_text(encoding='utf-8')
          old = '''            self._interface = await pytuya.connect(
                  self._dev_config_entry[CONF_HOST], self._dev_config_entry[CONF_DEVICE_ID],
                  self._local_key, float(self._dev_config_entry[CONF_PROTOCOL_VERSION]),
                  self._dev_config_entry.get(CONF_ENABLE_DEBUG, False), self,
                  cid=self._dev_config_entry.get("node_id"),
                  gateway_id=self._dev_config_entry.get("gateway_id"),
              )
          '''
          new = '''            node_id = self._dev_config_entry.get("node_id")
              gateway_id = self._dev_config_entry.get("gateway_id")
              if node_id and gateway_id:
                  from .gateway_transport import async_acquire_gateway_child

                  self._interface = await async_acquire_gateway_child(
                      self._hass,
                      host=self._dev_config_entry[CONF_HOST],
                      gateway_id=gateway_id,
                      local_key=self._local_key,
                      protocol_version=float(self._dev_config_entry[CONF_PROTOCOL_VERSION]),
                      enable_debug=self._dev_config_entry.get(CONF_ENABLE_DEBUG, False),
                      device_id=self._dev_config_entry[CONF_DEVICE_ID],
                      cid=node_id,
                      listener=self,
                  )
              else:
                  self._interface = await pytuya.connect(
                      self._dev_config_entry[CONF_HOST],
                      self._dev_config_entry[CONF_DEVICE_ID],
                      self._local_key,
                      float(self._dev_config_entry[CONF_PROTOCOL_VERSION]),
                      self._dev_config_entry.get(CONF_ENABLE_DEBUG, False),
                      self,
                  )
          '''
          if s.count(old) != 1:
              raise SystemExit(f'expected one connection block, found {s.count(old)}')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Validate and push
        shell: bash
        run: |
          python -m compileall -q custom_components/localtuya/common.py custom_components/localtuya/gateway_transport.py
          git rm .github/workflows/wire-shared-gateway-transport.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add custom_components/localtuya/common.py custom_components/localtuya/gateway_transport.py
          git commit -m "Share one LAN transport across gateway child devices"
          git push origin HEAD:develop
