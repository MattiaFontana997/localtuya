name: Patch Batch O runtime

on:
  push:
    paths:
      - .github/workflows/patch-batch-o-runtime.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: develop
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Patch runtime and tests
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one match, found {count}')
              p.write_text(text.replace(old, new))

          replace_once(
              'custom_components/localtuya/advanced_mapping.py',
              '''    if reverse:\n        if target_range and source_range:\n            result = source_range["min"] + ((result - target_range["min"]) * (source_range["max"] - source_range["min"]) / (target_range["max"] - target_range["min"]))\n        if "scale" in rule:\n            result *= float(rule["scale"])\n        if rule.get("invert") and source_range:\n            result = source_range["min"] + source_range["max"] - result\n        if "step" in rule:\n            step = float(rule["step"])\n            result = step * round(result / step)\n    else:\n        if rule.get("invert") and source_range:\n            result = source_range["min"] + source_range["max"] - result\n        if "scale" in rule:\n            result /= float(rule["scale"])\n        if target_range and source_range:\n            result = target_range["min"] + ((result - source_range["min"]) * (target_range["max"] - target_range["min"]) / (source_range["max"] - source_range["min"]))\n''',
              '''    if reverse:\n        # Tuya Local write order is scale -> target_range -> invert -> step.\n        if "scale" in rule:\n            result *= float(rule["scale"])\n        if target_range and source_range:\n            result = source_range["min"] + ((result - target_range["min"]) * (source_range["max"] - source_range["min"]) / (target_range["max"] - target_range["min"]))\n        if rule.get("invert") and source_range:\n            result = source_range["min"] + source_range["max"] - result\n        if "step" in rule:\n            step = float(rule["step"])\n            result = step * round(result / step)\n    else:\n        # Tuya Local read order is invert -> target_range -> scale.\n        if rule.get("invert") and source_range:\n            result = source_range["min"] + source_range["max"] - result\n        if target_range and source_range:\n            result = target_range["min"] + ((result - source_range["min"]) * (target_range["max"] - target_range["min"]) / (source_range["max"] - source_range["min"]))\n        if "scale" in rule:\n            result /= float(rule["scale"])\n'''
          )

          old_func = '''def map_value_to_dps(value: Any, rules: list[dict[str, Any]], status: dict[str, Any], primary_dp: int) -> dict[int, Any]:\n    rule = _find_rule_for_value(rules, value)\n    if rule is None:\n        return {primary_dp: value}\n    active = _condition_for_requested_value(rule, value) or _active_condition(rule, status)\n    effective = dict(rule)\n    if active:\n        effective.update({key: item for key, item in active.items() if key != "dps_val"})\n    if effective.get("invalid", False):\n        raise ValueError("Value is invalid for the active advanced mapping")\n    result = _transform_numeric(effective.get("dps_val", value), effective, reverse=True)\n    active_range = effective.get("range")\n    if active_range is not None and isinstance(result, (int, float)) and not isinstance(result, bool):\n        minimum = float(active_range["min"])\n        maximum = float(active_range["max"])\n        if float(result) < minimum or float(result) > maximum:\n            raise ValueError("Value is outside the active advanced mapping range")\n    target_dp = int(effective.get("value_redirect_dp", primary_dp))\n    writes = {target_dp: result}\n    constraint_dp = rule.get("constraint_dp")\n    if constraint_dp is not None:\n        for condition in rule.get("conditions", []):\n            if "value" in condition and _matches(condition["value"], value):\n                expected = condition.get("dps_val")\n                if not isinstance(expected, list) and expected is not None:\n                    writes[int(constraint_dp)] = expected\n                break\n    return writes\n'''
          new_func = '''def map_value_to_dps(\n    value: Any,\n    rules: list[dict[str, Any]],\n    status: dict[str, Any],\n    primary_dp: int,\n    mapping_by_dp: dict[str, list[dict[str, Any]]] | None = None,\n    _seen: set[int] | None = None,\n) -> dict[int, Any]:\n    rule = _find_rule_for_value(rules, value)\n    if rule is None:\n        return {primary_dp: value}\n    active = _condition_for_requested_value(rule, value) or _active_condition(rule, status)\n    effective = dict(rule)\n    if active:\n        effective.update({key: item for key, item in active.items() if key != "dps_val"})\n    if effective.get("invalid", False):\n        raise ValueError("Value is invalid for the active advanced mapping")\n\n    redirect_dp = effective.get("value_redirect_dp")\n    if redirect_dp is not None:\n        target_dp = int(redirect_dp)\n        seen = set() if _seen is None else set(_seen)\n        if target_dp == int(primary_dp) or target_dp in seen:\n            raise ValueError("Advanced mapping redirect cycle")\n        target_rules = (\n            mapping_by_dp.get(str(target_dp))\n            if isinstance(mapping_by_dp, dict)\n            else None\n        )\n        # Tuya Local redirects the original logical value before applying the\n        # source rule's scale/range/invert/step transforms. If the target has\n        # its own advanced mapping, recurse through it as well.\n        if target_rules:\n            return map_value_to_dps(\n                value,\n                target_rules,\n                status,\n                target_dp,\n                mapping_by_dp,\n                seen | {int(primary_dp)},\n            )\n        return {target_dp: value}\n\n    result = _transform_numeric(effective.get("dps_val", value), effective, reverse=True)\n    active_range = effective.get("range")\n    if active_range is not None and isinstance(result, (int, float)) and not isinstance(result, bool):\n        minimum = float(active_range["min"])\n        maximum = float(active_range["max"])\n        if float(result) < minimum or float(result) > maximum:\n            raise ValueError("Value is outside the active advanced mapping range")\n    writes = {int(primary_dp): result}\n    constraint_dp = rule.get("constraint_dp")\n    if constraint_dp is not None:\n        for condition in rule.get("conditions", []):\n            if "value" in condition and _matches(condition["value"], value):\n                expected = condition.get("dps_val")\n                if not isinstance(expected, list) and expected is not None:\n                    writes[int(constraint_dp)] = expected\n                break\n    return writes\n'''
          replace_once('custom_components/localtuya/advanced_mapping.py', old_func, new_func)

          replace_once(
              'custom_components/localtuya/common.py',
              'states = map_value_to_dps(state, rules, self._status, int(dp_index))',
              'states = map_value_to_dps(\n            state, rules, self._status, int(dp_index),\n            getattr(self, "_advanced_mapping_by_dp", {}),\n        )'
          )
          replace_once(
              'custom_components/localtuya/common.py',
              'mapped = map_value_to_dps(state, rules, self._status, dp_id) if rules else {dp_id: state}',
              'mapped = (\n                map_value_to_dps(\n                    state, rules, self._status, dp_id,\n                    getattr(self, "_advanced_mapping_by_dp", {}),\n                )\n                if rules else {dp_id: state}\n            )'
          )

          replace_once(
              'custom_components/localtuya/fan.py',
              '''        await self._device.set_dps(states)\n\n    async def async_turn_off''',
              '''        if any(self.has_advanced_mapping(dp) for dp in states):\n            await self.set_mapped_dps(states)\n        else:\n            await self._device.set_dps(states)\n\n    async def async_turn_off'''
          )
          replace_once(
              'custom_components/localtuya/fan.py',
              '''        await self._device.set_dps(states)\n\n    async def async_oscillate''',
              '''        if any(self.has_advanced_mapping(dp) for dp in states):\n            await self.set_mapped_dps(states)\n        else:\n            await self._device.set_dps(states)\n\n    async def async_oscillate'''
          )
          replace_once(
              'custom_components/localtuya/fan.py',
              '''    @property\n    def is_on(self) -> bool | None:\n''',
              '''    def _refresh_speed_count(self) -> None:\n        """Refresh speed count from active declarative step metadata."""\n        if not self.has_config(CONF_FAN_SPEED_CONTROL):\n            return\n        if self._speed_mapping:\n            self._attr_speed_count = len(self._speed_mapping["rules"])\n            return\n        if self._use_ordered_list:\n            self._attr_speed_count = len(self._ordered_list)\n            return\n        metadata = self.mapped_numeric_metadata(\n            self._config[CONF_FAN_SPEED_CONTROL]\n        )\n        step = metadata.get("step")\n        if isinstance(step, (int, float)) and not isinstance(step, bool) and step > 0:\n            self._attr_speed_count = max(\n                1, int(round(float(self._speed_range[1]) / float(step)))\n            )\n            return\n        self._attr_speed_count = int_states_in_range(self._speed_range)\n\n    @property\n    def is_on(self) -> bool | None:\n'''
          )
          replace_once(
              'custom_components/localtuya/fan.py',
              '''        if self.has_config(CONF_FAN_SPEED_CONTROL):\n            self._attr_percentage = self._raw_to_percentage(\n                self.dps_conf(CONF_FAN_SPEED_CONTROL)\n            )\n        else:\n            self._attr_percentage = None\n''',
              '''        if self.has_config(CONF_FAN_SPEED_CONTROL):\n            self._attr_percentage = self._raw_to_percentage(\n                self.dps_conf(CONF_FAN_SPEED_CONTROL)\n            )\n            self._refresh_speed_count()\n        else:\n            self._attr_percentage = None\n'''
          )

          test_path = Path('tests/test_advanced_mapping_v2.py')
          text = test_path.read_text()
          marker = '\n\nif __name__ == "__main__":\n'
          extra = '''\n    def test_transform_order_matches_tuya_local(self):\n        rules = [{\n            "range": {"min": 10, "max": 110},\n            "target_range": {"min": 100, "max": 200},\n            "invert": True,\n            "scale": 2,\n        }]\n        self.assertEqual(map_value_from_dps(30, rules, {})[0], 90)\n        self.assertEqual(map_value_to_dps(90, rules, {}, 7), {7: 30})\n\n    def test_recursive_redirect_write_maps_target(self):\n        mappings = {\n            "2": [{"value_redirect_dp": 3}],\n            "3": [{"scale": 10, "step": 5}],\n        }\n        self.assertEqual(\n            map_value_to_dps(21.2, mappings["2"], {}, 2, mappings),\n            {3: 210},\n        )\n\n    def test_recursive_redirect_cycle_fails_closed(self):\n        mappings = {\n            "2": [{"value_redirect_dp": 3}],\n            "3": [{"value_redirect_dp": 2}],\n        }\n        with self.assertRaises(ValueError):\n            map_value_to_dps(20, mappings["2"], {}, 2, mappings)\n'''
          if extra.strip() not in text:
              if marker not in text:
                  raise SystemExit('advanced mapping test marker missing')
              test_path.write_text(text.replace(marker, extra + marker))

          Path('tests/test_fan_advanced_mapping.py').write_text('''"""Fan regressions for conditional advanced mapping metadata."""\n\nimport unittest\n\nfrom custom_components.localtuya.const import CONF_FAN_SPEED_CONTROL\nfrom custom_components.localtuya.fan import LocaltuyaFan\n\n\nclass _Device:\n    def __init__(self):\n        self.single = None\n        self.multi = None\n\n    async def set_dp(self, value, dp):\n        self.single = (value, dp)\n\n    async def set_dps(self, states):\n        self.multi = dict(states)\n\n\nclass FanAdvancedMappingTests(unittest.IsolatedAsyncioTestCase):\n    def _fan(self):\n        fan = LocaltuyaFan.__new__(LocaltuyaFan)\n        fan._config = {CONF_FAN_SPEED_CONTROL: 2}\n        fan._dp_id = 1\n        fan._is_on = True\n        fan._speed_mapping = None\n        fan._use_ordered_list = False\n        fan._ordered_list = []\n        fan._speed_range = (1, 12)\n        fan._dps_type = int\n        fan._advanced_mapping = []\n        fan._advanced_mapping_by_dp = {\n            "2": [{\n                "constraint_dp": 3,\n                "conditions": [\n                    {"dps_val": "nature", "step": 4},\n                    {"dps_val": "sleep", "step": 4},\n                ],\n            }]\n        }\n        fan._status = {"1": True, "2": 7, "3": "nature"}\n        fan._device = _Device()\n        return fan\n\n    async def test_percentage_write_is_quantized_by_active_step(self):\n        fan = self._fan()\n        await fan.async_set_percentage(50)\n        self.assertEqual(fan._device.single, (8, 2))\n        self.assertIsNone(fan._device.multi)\n\n    def test_speed_count_follows_active_step(self):\n        fan = self._fan()\n        fan._refresh_speed_count()\n        self.assertEqual(fan._attr_speed_count, 3)\n        fan._status["3"] = "normal"\n        fan._refresh_speed_count()\n        self.assertEqual(fan._attr_speed_count, 12)\n\n\nif __name__ == "__main__":\n    unittest.main()\n''')
          PY
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements_test.txt
      - name: Run targeted tests
        run: |
          python -m pytest -q tests/test_advanced_mapping.py tests/test_advanced_mapping_v2.py tests/test_fan_advanced_mapping.py
      - name: Commit runtime changes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add custom_components/localtuya/advanced_mapping.py custom_components/localtuya/common.py custom_components/localtuya/fan.py tests/test_advanced_mapping_v2.py tests/test_fan_advanced_mapping.py
          git diff --cached --check
          git commit -m "Align Batch O advanced mapping runtime semantics"
          git push origin HEAD:develop
