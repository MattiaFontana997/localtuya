name: Patch read-only water heater target

on:
  push:
    paths:
      - .github/workflows/patch-water-heater-readonly.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: develop
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Apply runtime patch
        run: |
          python - <<'PY'
          from pathlib import Path

          const = Path('custom_components/localtuya/const.py')
          text = const.read_text()
          anchor = 'CONF_WATER_HEATER_TARGET_TEMPERATURE_DP = "water_heater_target_temperature_dp"\n'
          assert text.count(anchor) == 1
          text = text.replace(anchor, anchor + 'CONF_WATER_HEATER_TARGET_READONLY = "water_heater_target_readonly"\n', 1)
          const.write_text(text)

          path = Path('custom_components/localtuya/water_heater.py')
          text = path.read_text()
          anchor = '    CONF_WATER_HEATER_TARGET_TEMPERATURE_DP,\n'
          assert text.count(anchor) == 1
          text = text.replace(anchor, anchor + '    CONF_WATER_HEATER_TARGET_READONLY,\n', 1)
          anchor = '        self._default_mode = self._config.get(CONF_WATER_HEATER_DEFAULT_MODE)\n\n        features = WaterHeaterEntityFeature(0)\n'
          assert text.count(anchor) == 1
          text = text.replace(anchor, '        self._default_mode = self._config.get(CONF_WATER_HEATER_DEFAULT_MODE)\n        self._target_readonly = bool(self._config.get(CONF_WATER_HEATER_TARGET_READONLY, False))\n\n        features = WaterHeaterEntityFeature(0)\n', 1)
          old = '        if self.has_config(CONF_WATER_HEATER_TARGET_TEMPERATURE_DP):\n            features |= WaterHeaterEntityFeature.TARGET_TEMPERATURE\n'
          new = '        if self.has_config(CONF_WATER_HEATER_TARGET_TEMPERATURE_DP) and not self._target_readonly:\n            features |= WaterHeaterEntityFeature.TARGET_TEMPERATURE\n'
          assert text.count(old) == 1
          text = text.replace(old, new, 1)
          old = '        if kwargs.get(ATTR_TEMPERATURE) is not None:\n            dp_id = self._config.get(CONF_WATER_HEATER_TARGET_TEMPERATURE_DP)\n'
          new = '        if kwargs.get(ATTR_TEMPERATURE) is not None:\n            if self._target_readonly:\n                raise NotImplementedError()\n            dp_id = self._config.get(CONF_WATER_HEATER_TARGET_TEMPERATURE_DP)\n'
          assert text.count(old) == 1
          text = text.replace(old, new, 1)
          path.write_text(text)

          test = Path('tests/test_catalog_platforms_batch_b.py')
          text = test.read_text()
          anchor = '    CONF_WATER_HEATER_TARGET_TEMPERATURE_DP,\n'
          assert text.count(anchor) == 1
          text = text.replace(anchor, anchor + '    CONF_WATER_HEATER_TARGET_READONLY,\n', 1)
          marker = '    async def test_siren_uses_exact_catalog_values(self):\n'
          assert text.count(marker) == 1
          case = '''    async def test_water_heater_readonly_target_is_never_written(self):\n        config = {\n            "id": 3,\n            CONF_WATER_HEATER_TARGET_TEMPERATURE_DP: 3,\n            CONF_WATER_HEATER_TARGET_READONLY: True,\n        }\n        heater = _entity(LocaltuyaWaterHeater, config, {3: 50})\n        heater._scaling = 1.0\n        heater._target_readonly = True\n        heater._mode_values = {}\n        heater._away_mode = "away"\n        with self.assertRaises(NotImplementedError):\n            await heater.async_set_temperature(**{ATTR_TEMPERATURE: 60})\n        heater._device.set_dp.assert_not_awaited()\n\n'''
          text = text.replace(marker, case + marker, 1)
          test.write_text(text)
          PY
      - name: Install dependencies
        run: |
          python -m pip install -r requirements_test.txt
          python -m pip install pytest
      - name: Run regression
        run: python -m pytest -q tests/test_catalog_platforms_batch_b.py
      - name: Commit runtime support
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add custom_components/localtuya/const.py custom_components/localtuya/water_heater.py tests/test_catalog_platforms_batch_b.py
          git diff --cached --check
          git commit -m "Support read-only water heater targets"
          git push origin HEAD:develop
