reload:
  description: Reload localtuya and reconnect to all devices.

set_dp:
  description: Change the value of a datapoint (DP)
  fields:
    device_id:
      description: Device ID of device to change datapoint value for
      example: 11100118278aab4de001
    dp:
      description: Datapoint index
      example: 1
    value:
      description: New value to set
      example: False
refresh_device_catalog:
  description: Refresh the remote LocalTuya community device catalog.

export_device_mapping:
  description: Generate a privacy-safe community mapping for a configured LocalTuya device.
  fields:
    device_id:
      description: Tuya device ID to export. The ID itself is never included in the exported mapping.
      required: true
      example: bf1234567890abcdef
